<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章｜Edward 的 Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<main><article class="wrap narrow article" id="art"><div class="empty">載入中…</div></article></main>
<script type="module">
import { store } from "./assets/store.js";
import { header, footer, esc, fmtDate, fmtTime, md, readMins } from "./assets/ui.js";
const CFG = window.BLOG_CONFIG;
header("home"); footer();
const id = new URLSearchParams(location.search).get("id");
const art = document.getElementById("art");

async function render() {
  const p = id && await store.getPost(id);
  if (!p) { art.innerHTML = `<div class="empty">找不到這篇文章，可能已下架。<br><a href="index.html">回文章列表</a></div>`; return; }
  document.title = `${p.title}｜${CFG.siteName}`;
  art.innerHTML = `
    <a href="index.html" class="stamp">← 回文章列表</a>
    <div style="margin-top:14px"><span class="tag">${esc(p.category || "")}</span>
      ${p.status !== "published" ? `<span class="badge draft">草稿（只有你看得到）</span>` : ""}
      ${p.visibility === "members" ? `<span class="badge lock">會員限定</span>` : ""}</div>
    <h1>${esc(p.title)}</h1>
    <div class="dates">
      <span>✍️ ${esc(CFG.author)}</span>
      <span>發布：${fmtDate(p.publishedAt || p.createdAt)}</span>
      <span title="${fmtTime(p.updatedAt)}">最後更新：${fmtDate(p.updatedAt)}</span>
      ${p.body ? `<span>約 ${readMins(p.body)} 分鐘讀完</span>` : ""}
    </div>
    ${p.cover ? `<img src="${esc(p.cover)}" alt="" style="width:100%;border-radius:14px;margin-bottom:20px">` : ""}
    ${p.locked
      ? `<p class="prose">${esc(p.summary || "")}</p>
         <div class="paywall"><h3>🔒 這篇是會員限定文章</h3><p>免費註冊會員，就能看完整內容。</p>
         <a class="btn" href="login.html?next=${encodeURIComponent(location.pathname.split("/").pop() + location.search)}">登入／免費註冊</a></div>`
      : `<div class="prose">${md(p.body)}</div>`}
    ${(p.tags || []).length ? `<p class="stamp" style="margin-top:28px">標籤：${p.tags.map(t => `<a href="index.html?q=${encodeURIComponent(t)}">#${esc(t)}</a>`).join("　")}</p>` : ""}
    ${CFG.bookingUrl ? `<div class="cta"><div><b>想知道自己的情況怎麼規劃？</b><br><span style="opacity:.85">跟錢有關的問題，都可以找我！${esc(CFG.bookingNote || "")}。</span></div><a class="btn" href="${esc(CFG.bookingUrl)}" target="_blank" rel="noopener">預約諮詢</a></div>` : ""}`;
}
store.onAuth(render);
</script>
</body>
</html>
