<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#FFFAF0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章｜Edward 的 Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap"></noscript>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="assets/style.css?v=20261128030513">
<script src="config.js?v=20261128030513"></script>
<script defer src="assets/vendor/marked.min.js?v=20261128030513"></script>
<script defer src="assets/vendor/purify.min.js?v=20261128030513"></script>
</head>
<body>
<main><article class="wrap narrow article" id="art"><div class="empty">載入中…</div></article></main>
<script>window.__ebDeferFirebase = true;</script>
<script type="module">
import { store, isLive } from "./assets/store.js?v=20261128030513";
import { header, footer } from "./assets/ui.js?v=20261128030513";
import { renderArticle } from "./assets/article.js?v=20261128030513";
const CFG = window.BLOG_CONFIG;
const id = new URLSearchParams(location.search).get("id");
const art = document.getElementById("art");
// 先把公開文章的請求送出去，再啟動 Firebase（登入鈕可以晚一點）。
const postP = id ? store.getPublicPost(id) : Promise.resolve(null);
const listP = store.listPosts().catch(() => []);
header("home"); footer();
let firebaseKicked = false;
function kickAuth() { if (!firebaseKicked) { firebaseKicked = true; store.startFirebase(); } }

let list = [], painted = undefined, authUser, fastState = "wait", epoch = 0, paintKey = "";
const loginNext = location.pathname.split("/").pop() + location.search;
function sameUser(a, b) {
  if (a === undefined || b === undefined) return false;
  if (!a && !b) return true;
  if (!a || !b) return false;
  return a.uid === b.uid && !!a.isAdmin === !!b.isAdmin && !!a.approved === !!b.approved && a.status === b.status;
}
function markdownReady() {
  if (window.marked && window.DOMPurify) return Promise.resolve();
  return new Promise(resolve => {
    const t0 = Date.now();
    const t = setInterval(() => {
      if ((window.marked && window.DOMPurify) || Date.now() - t0 > 8000) { clearInterval(t); resolve(); }
    }, 16);
  });
}
function paint(p, user) {
  painted = p;
  const live = list.filter(x => isLive(x));
  const i = p ? live.findIndex(x => x.id === p.id) : -1;
  const next = p && live.length > 1 ? live[(i + 1) % live.length] : null;
  const nextId = next && next.id !== p.id ? next.id : "";
  const userKey = user ? [user.uid, user.isAdmin ? 1 : 0, user.approved ? 1 : 0, user.status || ""].join("|") : "";
  const key = (p ? [p.id, p.updatedAt || 0, p.locked ? 1 : 0, p.body ? p.body.length : 0, p.status, p.visibility].join("|") : "none") + "#" + userKey + "#" + nextId;
  if (key === paintKey) return;
  paintKey = key;
  if (!p) { art.innerHTML = `<div class="empty">找不到這篇文章，可能已下架。<br><a href="index.html">回文章列表</a></div>`; return; }
  document.title = `${p.title}｜${CFG.siteName}`;
  renderArticle(art, p, { CFG, next: nextId ? next : null, loginNext, user: user || null });
}
function needsPrivate(u, post) {
  return !!(u && (u.isAdmin || u.approved) && (!post || post.locked));
}
async function refetch(u) {
  const my = ++epoch;
  try {
    const p = await store.getPost(id);
    if (my !== epoch) return;
    await markdownReady();
    if (my !== epoch) return;
    fastState = p ? "hit" : "miss";
    paint(p, u);
  } catch (e) {
    if (my === epoch) paint(null, u);
  }
}
function onUser(u) {
  if (sameUser(authUser, u)) return;
  authUser = u;
  if (!id) { paint(null, u); return; }
  if (fastState === "wait") return;
  if (needsPrivate(u, fastState === "hit" ? painted : null)) { refetch(u); return; }
  if (fastState === "hit") paint(painted, u);
  else paint(null, u);
}
store.onAuth(u => onUser(u));
async function loadFast() {
  const my = ++epoch;
  let p = null;
  try {
    const [post, posts] = await Promise.all([postP, listP]);
    if (my !== epoch) return;
    list = posts || [];
    p = post;
    fastState = p ? "hit" : "miss";
  } catch (e) {
    if (my !== epoch) return;
    fastState = "error";
  }
  kickAuth();
  if (fastState === "error") { refetch(authUser || null); return; }
  if (fastState === "hit") {
    await markdownReady();
    if (my !== epoch) return;
    paint(p, authUser || null);
    if (authUser && needsPrivate(authUser, p)) refetch(authUser);
    return;
  }
  if (authUser && needsPrivate(authUser, null)) { refetch(authUser); return; }
  if (authUser !== undefined) { await markdownReady(); if (my === epoch) paint(null, authUser); }
}
loadFast();
</script>
</body>
</html>
