<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>認識 Edward｜3D 互動版</title>
<meta name="description" content="往下滑，用 3D 動畫認識 Edward：保險經紀 × 人生財務教練。">
<link rel="icon" href="assets/brand/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--dark:#2A1D15;--cream:#F6F0E6;--caramel:#C8843F;--soft:#D9C8B4}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;background:#140D09;color:var(--cream);font-family:'Noto Sans TC',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#scroller section{display:block}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .45s ease}
#text{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:center;padding:0 max(24px,8vw);text-wrap:pretty}
.t-eyebrow{font-size:clamp(14px,1.6vw,22px);letter-spacing:.25em;color:var(--caramel);font-weight:700;margin:0 0 18px}
.t-big{font-family:'Noto Serif TC',Georgia,serif;font-weight:700;font-size:clamp(30px,5.2vw,84px);line-height:1.3;margin:0;text-shadow:0 2px 24px rgba(0,0,0,.55)}
.t-lead{font-size:clamp(17px,2.2vw,32px);line-height:1.6;color:var(--soft);margin:22px 0 0;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.t-note{font-size:clamp(12px,1.1vw,16px);color:#BFAE99;margin-top:18px;max-width:900px;line-height:1.5}
.acc{color:var(--caramel)}
.t-big,.t-eyebrow,.card h3,#boring .bt,#boring .bs{text-wrap:balance}.t-lead,.t-note,.card p,.counter,#boring li{text-wrap:pretty}
.nw{white-space:nowrap}
.line{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.line.on{opacity:1;transform:none}
.top{justify-content:flex-start!important;padding-top:max(56px,9vh)!important}
.bottom{justify-content:flex-end!important;padding-bottom:max(90px,13vh)!important}
/* 無聊頁 */
#boring{position:fixed;inset:0;background:#fff;color:#1a1a1a;font-family:Arial,'Noto Sans TC',sans-serif;display:none;flex-direction:column;justify-content:center;padding:0 10vw}
#boring.show{display:flex}
#boring .bt{font-size:clamp(34px,5vw,80px);text-align:center;margin:0}
#boring .bs{font-size:clamp(18px,2.4vw,38px);color:#888;text-align:center;margin:18px 0 0}
#boring .bh{font-size:clamp(30px,4.2vw,66px);margin:0 0 4vh}
#boring ul{font-size:clamp(20px,2.6vw,40px);line-height:1.9;margin:0;padding-left:1.4em}
#boring .bar{position:absolute;left:0;right:0;bottom:0;height:3vh;background:#3F6FB5}
#boring .pg{position:absolute;right:3vw;bottom:5vh;color:#777;font-size:clamp(14px,1.3vw,20px)}
/* 標籤（跟著 3D 物件走） */
.lbl{position:fixed;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;text-align:center;white-space:nowrap;opacity:0;transition:opacity .6s ease}
.lbl.on{opacity:1}
br.mb{display:none}
@media (max-width:760px){br.mb{display:inline}.pc{display:none}}
.lbl b{display:block;font-family:'Noto Serif TC',serif;font-size:clamp(18px,2.2vw,34px);color:var(--cream);text-shadow:0 2px 12px rgba(0,0,0,.8)}
.lbl span{display:block;font-size:clamp(12px,1.2vw,18px);color:var(--soft);margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
/* 卡片頁 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,32px);margin-top:28px;max-width:1300px}
.card{background:rgba(42,29,21,.78);border:1px solid rgba(200,132,63,.35);border-radius:18px;padding:clamp(16px,2.4vw,36px);backdrop-filter:blur(6px)}
.card .tag{color:var(--caramel);font-weight:700;letter-spacing:.15em;font-size:clamp(12px,1.2vw,18px)}
.card h3{font-family:'Noto Serif TC',serif;font-size:clamp(20px,2.4vw,36px);margin:10px 0}
.card p{margin:0;color:var(--soft);font-size:clamp(14px,1.4vw,21px);line-height:1.7}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pill{background:var(--caramel);color:var(--dark);font-weight:700;border-radius:999px;padding:8px 18px;font-size:clamp(13px,1.3vw,19px);white-space:nowrap}
a.pill{pointer-events:auto;text-decoration:none}
.p10{text-align:center;width:100%;display:flex;flex-direction:column;align-items:center}
.p10 .cards{width:100%;max-width:1100px}
.p10 .pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:440px;margin-inline:auto}
.p10 .pill{text-align:center}
@media (max-width:760px){.cards{grid-template-columns:1fr}.card p br:not(.mb){display:inline}}
.counter{font-family:'Noto Serif TC',serif;font-size:clamp(16px,1.8vw,26px);color:var(--soft);margin-top:10px;font-variant-numeric:tabular-nums}
/* 介面 */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,2vw) calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
#ui *{pointer-events:auto}
/* 右上角音樂鈕 */
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top));right:max(14px,1.6vw);z-index:7;display:flex;align-items:center;gap:6px;height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(20,13,9,.55);color:var(--cream);font:600 13px/1 'Noto Sans TC',sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
#snd .ic{font-size:17px;line-height:1}
#snd .tx{white-space:nowrap}
#snd.on .tx{display:none}
#snd.on .ic{animation:snd 1.6s ease-in-out infinite}
#snd.off .ic{opacity:.55;text-decoration:line-through}
@keyframes snd{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
body.boring-on #snd{color:#555;background:rgba(255,255,255,.85);border-color:#ccc}
#sndp{position:fixed;top:calc(60px + env(safe-area-inset-top));right:max(14px,1.6vw);z-index:8;width:min(300px,calc(100vw - 28px));padding:14px 14px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(20,13,9,.88);color:var(--cream);font:400 14px/1.4 'Noto Sans TC',sans-serif;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#sndp[hidden]{display:none}
#sndp .sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#sndp .sp-head b{font-size:15px}
#sndp .sp-sw{display:flex;align-items:center;gap:8px;border:0;background:none;color:inherit;font:600 13px/1 'Noto Sans TC',sans-serif;cursor:pointer;padding:4px}
#sndp .sp-sw i{position:relative;width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.25);transition:background .2s}
#sndp .sp-sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
#sndp .sp-sw.on i{background:#c8935a}
#sndp .sp-sw.on i::after{transform:translateX(18px)}
#sndp .sp-vol{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#sndp .sp-vol span{white-space:nowrap}
#sndp .sp-vol input{flex:1;min-width:0;accent-color:#c8935a;height:28px}
#sndp .sp-vol em{font-style:normal;width:3.2em;text-align:right;font-variant-numeric:tabular-nums;opacity:.8}
#sndp .sp-t{margin:0 0 8px;font-size:12px;opacity:.7}
#sndp .sp-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#sndp .sp-st{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:inherit;cursor:pointer;font-family:'Noto Sans TC',sans-serif}
#sndp .sp-st b{font-size:14px;white-space:nowrap}
#sndp .sp-st small{font-size:11.5px;line-height:1.35;opacity:.72;text-wrap:pretty}
#sndp .sp-st.cur{border-color:#c8935a;background:rgba(200,147,90,.22)}
#sndp .sp-st.cur b::before{content:"♪ ";color:#e0b07a}
body.boring-on #sndp{color:#333;background:rgba(255,255,255,.96);border-color:#ddd}
body.boring-on #sndp .sp-st{border-color:#ddd;background:#f6f6f6}
body.boring-on #sndp .sp-sw:not(.on) i{background:#ccc}
#prog{flex:1;height:3px;background:rgba(255,255,255,.15);margin:0 16px;border-radius:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--caramel);transition:width .5s ease}
.btn{background:rgba(20,13,9,.6);color:var(--cream);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
#hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);font-size:14px;color:#888;transition:opacity .8s;pointer-events:none;white-space:nowrap}
body.boring-on #ui .btn,body.boring-on #hint{color:#555;background:rgba(255,255,255,.8);border-color:#ccc}
/* 右側捲動進度條（只顯示、不能拉） */
#vbar{position:fixed;right:max(10px,1.2vw);top:50%;transform:translateY(-50%);width:6px;height:56vh;border-radius:6px;background:rgba(255,255,255,.18);box-shadow:0 0 0 1px rgba(0,0,0,.25);pointer-events:none;z-index:6}
#vbar i{position:absolute;left:0;right:0;top:0;height:0;border-radius:6px;background:linear-gradient(#E9B27A,var(--caramel));box-shadow:0 0 10px rgba(233,178,122,.75)}
#vbar b{position:absolute;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;top:0;border-radius:50%;background:#F6E3C8;box-shadow:0 0 12px rgba(233,178,122,.9)}
body.boring-on #vbar{background:rgba(0,0,0,.12);box-shadow:none}
@media (max-width:760px){#vbar{right:6px;width:5px;height:50vh}#vbar b{width:12px;height:12px;margin:-6px 0 0 -6px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fade"></div>
<div id="text"></div>
<div id="labels"></div>
<div id="boring"></div>
<div id="ui">
  <button class="btn" id="prev" aria-label="上一段">↑</button>
  <div id="prog"><i></i></div>
  <a class="btn" id="flat" href="about.html">回「關於我」</a>
  <button class="btn" id="next" aria-label="下一段" style="margin-left:10px">↓</button>
</div>
<div id="hint">↓ 往下滑，動畫就會跟著動</div>
<div id="vbar" aria-hidden="true"><i></i><b></b></div>
<button id="snd" type="button" aria-label="音樂設定" aria-expanded="false"><span class="ic">♪</span><span class="tx">輕觸開啟音樂</span></button>
<div id="sndp" role="dialog" aria-label="音樂設定" hidden></div>
<div id="scroller"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= 基本設定 ================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const textEl = document.getElementById('text');
const labelsEl = document.getElementById('labels');
const boringEl = document.getElementById('boring');
const fadeEl = document.getElementById('fade');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = innerWidth, H = innerHeight;
const isNarrow = () => W < 760;

function resize(){
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  slides.forEach(s => { if (s.cam){ s.cam.aspect = W/H; s.cam.updateProjectionMatrix(); } });
}
addEventListener('resize', resize);

/* 小工具 */
const rand = (a,b) => a + Math.random()*(b-a);
const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);
const lerp = (a,b,t) => a+(b-a)*t;
function stars(n=1500, r=400, color=0xffffff, size=1.2){
  const g = new THREE.BufferGeometry(); const p = new Float32Array(n*3);
  for(let i=0;i<n;i++){ const v = new THREE.Vector3().randomDirection().multiplyScalar(r*rand(.6,1)); p.set([v.x,Math.abs(v.y)*0.9+5,v.z],i*3); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  return new THREE.Points(g, new THREE.PointsMaterial({color, size, sizeAttenuation:false, transparent:true, opacity:.85}));
}
function glowSprite(color='#ffcf8a', size=4){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,color); gr.addColorStop(.25,color+'aa'); gr.addColorStop(1,color+'00');
  x.fillStyle = gr; x.fillRect(0,0,128,128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
  s.scale.set(size,size,1); return s;
}
function newCam(fov=50){ const c = new THREE.PerspectiveCamera(fov, W/H, .1, 2000); return c; }
/* 錢的複利：每月月底投 1 萬、年化 6%、月複利 */
const FV = yrs => { const r=.005, n=Math.round(yrs*12); return n<=0?0:10000*((Math.pow(1+r,n)-1)/r); };

/* 文字 */
function setText(html, cls=''){
  textEl.className = cls; textEl.innerHTML = html;
  [...textEl.querySelectorAll('.line')].forEach((el,i) => { el._th = reduce?0:Math.min(.55, .03 + (+el.dataset.d||i)*.055); });
}
/* 跟著 3D 物件的標籤 */
let labels = [];
function setLabels(list){ labelsEl.innerHTML=''; labels = list.map(l => { const d=document.createElement('div'); d.className='lbl'; d.innerHTML=l.html; labelsEl.appendChild(d); d._th = reduce?0:Math.min(.7,(l.delay||900)/1000/(slides[cur].D||5)); return {el:d, obj:l.obj, off:l.off||new THREE.Vector3()}; }); }
const _v = new THREE.Vector3();
function placeLabels(cam){ for(const l of labels){ l.obj.getWorldPosition(_v); _v.add(l.off).project(cam); const hw=(l.el.offsetWidth||0)/2, x=(_v.x+1)/2*W; l.el.style.left=Math.min(W-hw-(isNarrow()?20:30), Math.max(hw+12, x))+'px'; l.el.style.top=((1-_v.y)/2*H)+'px'; } }

/* ================= 各頁場景 ================= */
const slides = [];

/* 1、2、15：故意很無聊的投影片 */
const boring = (html) => ({ boring:true, enter(){ boringEl.innerHTML = html + '<div class="bar"></div><p class="pg">'+(cur+1)+'</p>'; } });
slides.push(boring('<p class="bt">小編自我介紹</p><p class="bs">Edward<span class="pc">｜</span><br class="mb">保險經紀人業務（事業部負責人）<span class="pc">、</span><br>CFC 財務教練</p>'));
slides.push(boring('<ul><li>個人經歷</li><li>個人簡介</li></ul>'));

/* 3：打破 —— 白色碎片炸開，飄進星空 */
slides.push((()=>{
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0907);
  const cam = newCam(55); scene.add(stars(1800, 300));
  const N = 260, geo = new THREE.PlaneGeometry(1,0.56);
  const mat = new THREE.MeshBasicMaterial({color:0xf3eee7, side:THREE.DoubleSide});
  const mesh = new THREE.InstancedMesh(geo, mat, N); scene.add(mesh);
  const parts = []; const cols = 20, rows = 13;
  for(let i=0;i<N;i++){ const cx=(i%cols)-cols/2+.5, cy=Math.floor(i/cols)-rows/2+.5;
    parts.push({p0:new THREE.Vector3(cx*0.9, cy*0.52, 0), v:new THREE.Vector3(rand(-1,1)*6, rand(-1,1)*5, rand(2,14)), r:new THREE.Vector3(rand(-3,3),rand(-3,3),rand(-3,3))}); }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3(0.9,0.94,1), pos = new THREE.Vector3();
  let t0 = 0;
  return { scene, cam,
    enter(){ t0 = 0; cam.position.set(0,0,12); cam.lookAt(0,0,0);
      setText('<p class="t-big line" data-d="2">這種簡報，</p><p class="t-big line" data-d="3">大多數人看到這</p><p class="t-big line acc" data-d="4">就開始放空了！</p><p class="t-lead line" data-d="7">所以，讓大家換個方式認識我。</p>'); },
    update(dt){ t0 += dt; const k = reduce?3:Math.max(0, t0-0.9);
      for(let i=0;i<N;i++){ const P=parts[i]; const s=ease(k/2.2)*1;
        pos.copy(P.p0).addScaledVector(P.v, s*3.2 + k*0.35); e.set(P.r.x*s, P.r.y*s, P.r.z*s); q.setFromEuler(e);
        m4.compose(pos,q,sc); mesh.setMatrixAt(i,m4); }
      mesh.instanceMatrix.needsUpdate = true; cam.position.z = 12 + Math.min(k,6)*0.4; }
  };
})());

/* 4：不是省錢、不是買商品 —— 霧中漂浮的金幣與價格標籤，慢慢淡掉 */
slides.push((()=>{
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b120c); scene.fog = new THREE.FogExp2(0x1b120c, 0.045);
  const cam = newCam(50);
  scene.add(new THREE.AmbientLight(0xffe2c0, .6)); const dl = new THREE.DirectionalLight(0xffc98a, 2.2); dl.position.set(4,6,5); scene.add(dl);
  const coinG = new THREE.CylinderGeometry(.5,.5,.08,40);
  const coinM = new THREE.MeshStandardMaterial({color:0xc9954a, metalness:.85, roughness:.3});
  const coins = new THREE.Group(); scene.add(coins);
  for(let i=0;i<70;i++){ const c = new THREE.Mesh(coinG, coinM); c.position.set(rand(-9,9), rand(-5,5), rand(-14,2)); c.rotation.set(rand(0,6),rand(0,6),rand(0,6)); c.userData.s = rand(.2,.8); coins.add(c); }
  let t=0;
  return { scene, cam,
    enter(){ t=0; cam.position.set(0,0,8); cam.lookAt(0,0,0);
      setText('<p class="t-eyebrow line" data-d="0">我怎麼看財務規劃</p><p class="t-big line" data-d="1">財務規劃</p><p class="t-big line" data-d="2">不是叫你省錢</p><p class="t-big line" data-d="3">也不是叫你買商品</p>'); },
    update(dt){ t+=dt; coins.children.forEach(c=>{ c.rotation.x += dt*c.userData.s; c.rotation.y += dt*c.userData.s*.7; c.position.y += Math.sin(t+c.position.x)*dt*.1; });
      cam.position.z = 8 - Math.min(t,10)*0.15; }
  };
})());

/* 5：節奏 —— 三個軌道（賺錢、存錢、花錢）一起轉，越轉越同步 */
slides.push((()=>{
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x120c08);
  const cam = newCam(45); scene.add(stars(1200, 300, 0xffe6c4));
  const cols = [0xc8843f, 0xe8d3b0, 0x8fa3a0];
  const rings = [], balls = [];
  [3,4.4,5.8].forEach((r,i)=>{
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r,.025,8,160), new THREE.MeshBasicMaterial({color:cols[i], transparent:true, opacity:.55}));
    ring.rotation.x = Math.PI/2; scene.add(ring); rings.push(ring);
    const b = new THREE.Mesh(new THREE.SphereGeometry(.28,24,24), new THREE.MeshBasicMaterial({color:cols[i]})); scene.add(b);
    const g = glowSprite(i===0?'#ffb36b':i===1?'#fff1d6':'#bfe0d8', 1.3); b.add(g); balls.push({b, r, ph:rand(0,6), sp:[.9,.55,1.4][i]});
  });
  const center = glowSprite('#ffcf8a', 2); scene.add(center);
  let t=0;
  return { scene, cam,
    enter(){ t=0; setText('<p class="t-eyebrow line" data-d="0">我做的事</p><p class="t-big line" data-d="1">把<span class="acc">賺錢、存錢、花錢</span><br class="mb">的節奏理清楚</p><p class="t-lead line" data-d="3">讓現在的現金流<br>對齊你未來想過的人生！</p>','top');
      setLabels([{obj:balls[0].b, html:'<b>賺錢</b>', off:new THREE.Vector3(0,.8,0), delay:1600},{obj:balls[1].b, html:'<b>存錢</b>', off:new THREE.Vector3(0,.8,0), delay:1800},{obj:balls[2].b, html:'<b>花錢</b>', off:new THREE.Vector3(0,.8,0), delay:2000}]); },
    update(dt){ t+=dt; const sync = ease(t/6);
      balls.forEach((o,i)=>{ const sp = lerp(o.sp, .6, sync); o.ph += dt*sp; const ph = lerp(o.ph, t*.6 + i*2.094, sync*0.9);
        o.b.position.set(Math.cos(ph)*o.r, 0, Math.sin(ph)*o.r); });

      for(let i=0;i<FN;i++){ const s=seeds[i]; fp[i*3]=s[0]+Math.sin(t*.4+s[3])*.6; fp[i*3+1]=s[1]+Math.sin(t*.9+s[3]*2)*.25; fp[i*3+2]=s[2]+Math.cos(t*.3+s[3])*.6; }
      fg.attributes.position.needsUpdate = true;
      const k = reduce?1:ease(t/9); const lx = isNarrow()?0:-2.4; cam.position.set(lerp(1.2,4,k)+lx, lerp(1.6,5.5,k), lerp(3.2,13,k)); cam.lookAt(lx,lerp(1.6,1.2,k),0); }
  };
})());

/* 14：下一步 —— 日出 */
slides.push((()=>{
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a1a14); scene.fog = new THREE.Fog(0xd9905a, 20, 90);
  const cam = newCam(50);
  scene.add(new THREE.HemisphereLight(0xffd8a8, 0x6a4026, 2));
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(400,400,80,80), new THREE.MeshStandardMaterial({color:0xa06a46, roughness:.3, metalness:.35})); sea.rotation.x=-Math.PI/2; scene.add(sea);
  const sun = glowSprite('#ffe0a8', 40); sun.position.set(0,-4,-90); scene.add(sun);
  const sunL = new THREE.DirectionalLight(0xffb878, 2); sunL.position.set(0,3,-40); scene.add(sunL);
  const pos = sea.geometry.attributes.position; const base = Float32Array.from(pos.array);
  let t=0; const bg0 = new THREE.Color(0x2a1a14), bg1 = new THREE.Color(0xe7a066);
  return { scene, cam,
    enter(){ t=0; cam.position.set(0,3,20); cam.lookAt(0,4,-50);
      setText('<p class="t-eyebrow line" data-d="0" style="color:#5a2f10">下一步</p><p class="t-big line" data-d="1">先聊 20 分鐘</p><p class="t-lead line" data-d="2" style="color:#fff3e2">不推商品<span class="pc">，</span><br class="mb">先幫你看清楚自己卡在哪一格</p><div class="pills line" data-d="4"><a class="pill" href="https://jonesgoober8433-lab.github.io/edward-consult/" target="_blank" rel="noopener">預約諮詢</a><a class="pill" href="./">看 Edward 的 Blog</a></div>'); },
    update(dt){ t+=dt; const k = reduce?1:ease(t/5);
      sun.position.y = lerp(-6, 14, k); scene.background.copy(bg0).lerp(bg1,k); sunL.intensity = 1 + 2*k;
      for(let i=0;i<pos.count;i++){ const x=base[i*3], y=base[i*3+1]; pos.array[i*3+2] = Math.sin(x*.15+t)*.25 + Math.cos(y*.12+t*.8)*.25; } pos.needsUpdate = true; sea.geometry.computeVertexNormals(); }
  };
})());


/* ================= 往下滑＝時間軸 ================= */
const D = {2:4.5,3:6,4:8,5:4,6:8,7:8,8:4.5,9:4,10:5,11:5,12:9,13:5};
slides.forEach((sl,i)=>{ sl.D = D[i] || 0; });
const scroller = document.getElementById('scroller');
const secs = slides.map((sl,i)=>{ const d=document.createElement('section'); d.style.height = (sl.boring ? 110 : 60 + sl.D*28) + 'vh'; scroller.appendChild(d); return d; });
let cur = -1, vt = 0, lastT = 0;
const prog = document.querySelector('#prog i');
const vFill = document.querySelector('#vbar i'), vDot = document.querySelector('#vbar b');
function enterSlide(i){
  cur = i; const s = slides[i];
  textEl.innerHTML=''; labelsEl.innerHTML=''; labels=[];
  document.body.classList.toggle('boring-on', !!s.boring);
  boringEl.classList.toggle('show', !!s.boring);
  if (s.cam){ s.cam.aspect = W/H; s.cam.updateProjectionMatrix(); }
  s.enter && s.enter();
  vt = 0; lastT = 0;
  fadeEl.style.transition='none'; fadeEl.style.opacity = s.boring?0:.85;
  requestAnimationFrame(()=>{ fadeEl.style.transition='opacity .45s ease'; fadeEl.style.opacity=0; });
}
function where(){
  const y = scrollY + H*0.5; let i = 0;
  for (let k=0;k<secs.length;k++){ if (secs[k].offsetTop <= y) i = k; }
  const sec = secs[i], span = Math.max(1, sec.offsetHeight - H*0.5);
  const p = Math.min(1, Math.max(0, (scrollY + H*0.5 - sec.offsetTop) / span));
  return [i, p];
}
function jump(d){ const [i] = where(); const k = Math.min(secs.length-1, Math.max(0, i+d)); scrollTo({top: Math.max(0, secs[k].offsetTop - H*0.45 + 2), behavior:'smooth'}); }
document.getElementById('next').onclick = () => jump(1);
document.getElementById('prev').onclick = () => jump(-1);
addEventListener('keydown', e => { if(['ArrowRight','PageDown'].includes(e.key)){ e.preventDefault(); jump(1); } if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); jump(-1); } });
addEventListener('scroll', ()=>{ document.getElementById('hint').style.opacity = scrollY>40?0:1; }, {passive:true});

/* ================= 主迴圈 ================= */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const real = Math.min(clock.getDelta(), .1);
  const [i, p] = where();
  if (i !== cur) enterSlide(i);
  const s = slides[cur];
  const total = document.documentElement.scrollHeight - H;
  const pct = (total>0 ? Math.min(100, scrollY/total*100) : 0) + '%';
  prog.style.width = pct; vFill.style.height = pct; vDot.style.top = pct;
  if (s.boring) return;
  for (const el of textEl.querySelectorAll('.line')) el.classList.toggle('on', p >= el._th);
  for (const l of labels) l.el.classList.toggle('on', p >= l.el._th);
  const target = reduce ? s.D : p * s.D;
  vt += (target - vt) * Math.min(1, real*8);            // 平滑跟隨捲動
  const dt = (vt - lastT) + real*0.04;                    // 加一點點「靜止時的呼吸感」
  lastT = vt;
  s.update && s.update(dt);
  if (s.split){
    renderer.setScissorTest(true);
    renderer.setViewport(0,0,W,H);
    if (isNarrow()){ const hh = Math.floor(H/2); renderer.setScissor(0,hh,W,H-hh); renderer.render(s.scene, s.cam); renderer.setScissor(0,0,W,hh); renderer.render(s.split, s.cam); }
    else { const half = Math.floor(W/2); renderer.setScissor(0,0,half,H); renderer.render(s.scene, s.cam); renderer.setScissor(half,0,W-half,H); renderer.render(s.split, s.cam); }
    renderer.setScissorTest(false);
  } else renderer.render(s.scene, s.cam);
}
resize(); loop();

/* ================= 輕音樂（瀏覽器即時產生，不用音樂檔、沒有版權問題） ================= */
// 預設開啟：瀏覽器規定要先有一次觸控／點擊才能出聲，所以第一次碰螢幕就自動開始。
// 右上角 ♪ 打開面板：開關、音量、4 種曲風；選擇會記在這台裝置（Edward 2026-11-28）
const sndBtn = document.getElementById('snd'), sndPanel = document.getElementById('sndp');
const Music = (() => {
  let ctx = null, master = null, lp = null, wet = null, bus = null, noise = null, timer = null;
  let nextChord = 0, nextStep = 0, ci = 0, si = 0, want = true, playing = false;
  const store = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
                  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  let vol = Math.max(0, Math.min(100, +store.get('intro-vol', 60) || 0));
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  // 單音：鋼琴／音樂盒／撥弦都用這個，差在音色與尾音長短
  function tone(t, m, o){
    const g = ctx.createGain(), a = ctx.createOscillator(); a.type = o.wave || 'sine'; a.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol, t + (o.att || .015)); g.gain.exponentialRampToValueAtTime(.0006, t + o.dec);
    a.connect(g); a.start(t); a.stop(t + o.dec + .1);
    if (o.part){ const b = ctx.createOscillator(), h = ctx.createGain(); b.type = 'sine'; b.frequency.value = hz(m) * o.part;
      h.gain.setValueAtTime(0, t); h.gain.linearRampToValueAtTime(o.vol * (o.pv || .3), t + .01); h.gain.exponentialRampToValueAtTime(.0005, t + o.dec * .45);
      b.connect(h); h.connect(bus); b.start(t); b.stop(t + o.dec); }
    g.connect(bus);
  }
  function pad(t, notes, st){
    notes.forEach((m, i) => { [-4, 4].forEach(det => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = i < 2 ? 'sine' : 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
      const v = (i < 2 ? .05 : .028) * st.padVol, L = st.len;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + Math.min(2.6, L * .35)); g.gain.setValueAtTime(v, t + L - 1); g.gain.linearRampToValueAtTime(0, t + L + 2);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + L + 2.2); }); });
  }
  function hit(t, kind){
    if (kind === 'kick'){ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .18);
      g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g); g.connect(bus); o.start(t); o.stop(t + .4); return; }
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise;
    if (kind === 'snare'){ f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.001, t + .22); }
    else { f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.001, t + .06); }
    s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + .3);
  }
  // 4 種曲風：chords＝和弦、len＝每個和弦幾秒、step＝節拍格、note＝每一格要彈什麼
  const STYLES = [
    { key: 'calm', name: '溫柔氛圍', desc: '慢慢流動的和弦<br>最安靜', lp: 2200, wet: .45, len: 8, step: .25, padVol: 1,
      chords: [[48,55,64,71,74],[45,52,60,67,71],[41,48,57,64,69],[43,50,59,62,69]],
      note(t, k){ if (k % 3 === 0 && Math.random() < .55) tone(t, rnd([72,74,76,79,81,84,86,88]), { vol: .045, dec: 2.2, att: .02 }); } },
    { key: 'piano', name: '輕快鋼琴', desc: '溫暖的分解和弦<br>比較有精神', lp: 3800, wet: .3, len: 4, step: 1/3, padVol: .45,
      chords: [[48,60,64,67],[43,55,59,62],[45,57,60,64],[41,53,57,60]],
      note(t, k, ch){ const up = ch.slice(1).map(m => m + 12), seq = [0,1,2,1,2,0,1,2,0,2,1,2]; tone(t, up[seq[k % 12] % up.length], { wave: 'triangle', vol: .05, dec: 1.4, part: 2, pv: .25 });
        if (k % 6 === 0) tone(t, ch[0], { wave: 'triangle', vol: .06, dec: 2.4 });
        if (k % 3 === 0 && Math.random() < .25) tone(t, rnd([76,79,81,84,86]), { wave: 'triangle', vol: .04, dec: 1.6, part: 2, pv: .2 }); } },
    { key: 'lofi', name: '深夜 Lo-fi', desc: '慵懶的爵士和弦<br>加上輕輕的鼓', lp: 1500, wet: .35, len: 3.2, step: .4, padVol: .8,
      chords: [[50,53,57,60,64],[43,53,59,64],[48,55,59,62,64],[45,55,61,65]],
      note(t, k){ const b = k % 8; if (b === 0 || b === 5) hit(t, 'kick'); if (b === 2 || b === 6) hit(t, 'snare'); hit(t + (k % 2 ? .06 : 0), 'hat');
        if (b === 3 && Math.random() < .5) tone(t, rnd([74,76,77,79,81]), { vol: .035, dec: 1.8, att: .03 }); } },
    { key: 'bell', name: '晨光音樂盒', desc: '清脆的音樂盒<br>明亮清新', lp: 6000, wet: .5, len: 6, step: .375, padVol: .55,
      chords: [[48,55,64],[52,59,67],[53,60,69],[55,62,71]],
      note(t, k){ if (Math.random() < .6) tone(t, rnd([84,86,88,91,93,96]), { vol: .03, dec: 2.6, att: .005, part: 2.76, pv: .35 }); } },
  ];
  si = Math.max(0, STYLES.findIndex(s => s.key === store.get('intro-style', 'calm')));
  function impulse(sec){ const n = ctx.sampleRate*sec, b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n, 2.6); } return b; }
  function newBus(){ const old = bus; bus = ctx.createGain(); bus.gain.value = 0; bus.connect(lp); bus.connect(rv);
    bus.gain.setTargetAtTime(1, ctx.currentTime, .4);
    if (old){ old.gain.cancelScheduledValues(ctx.currentTime); old.gain.setTargetAtTime(0, ctx.currentTime, .3); setTimeout(() => { try { old.disconnect(); } catch(e){} }, 2500); } }
  let rv = null;
  function build(){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}   // iPhone 靜音模式也能聽到
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = STYLES[si].lp; lp.connect(master);
    rv = ctx.createConvolver(); rv.buffer = impulse(3.2); wet = ctx.createGain(); wet.gain.value = STYLES[si].wet; rv.connect(wet); wet.connect(lp);
    const n = ctx.sampleRate * .5; noise = ctx.createBuffer(1, n, ctx.sampleRate); const d = noise.getChannelData(0); for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    newBus(); return true;
  }
  function tick(){
    const now = ctx.currentTime, st = STYLES[si];
    while (nextChord < now + 1) { pad(nextChord, st.chords[ci % st.chords.length], st); nextChord += st.len; ci++; }
    while (nextStep < now + 1) { const k = Math.round((nextStep - chordStart) / st.step);
      const ch = st.chords[Math.max(0, Math.floor((nextStep - chordStart) / st.len)) % st.chords.length];
      st.note(nextStep, k, ch); nextStep += st.step; }
  }
  let chordStart = 0;
  function restart(){ ci = 0; chordStart = nextChord = nextStep = ctx.currentTime + .15; }
  const level = () => Math.pow(vol / 100, 1.6) * 1.1;   // 音量滑桿 → 實際大小（耳朵對小聲比較敏感，所以用曲線）
  async function on(){
    if (!ctx && !build()) return false;
    try { await ctx.resume(); } catch(e){}
    if (ctx.state !== 'running') return false;
    if (!timer){ restart(); tick(); timer = setInterval(tick, 250); }
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(level(), ctx.currentTime, 1.2);
    playing = true; return true;
  }
  function off(){ if (!ctx) return; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0, ctx.currentTime, .35);
    setTimeout(() => { if (!playing){ clearInterval(timer); timer = null; ctx.suspend(); } }, 1500); playing = false; }
  function setVol(v){ vol = v; store.set('intro-vol', v); if (ctx && playing){ master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(level(), ctx.currentTime, .08); } ui(); }
  async function setStyle(i){ si = i; store.set('intro-style', STYLES[i].key);
    if (ctx){ lp.frequency.setTargetAtTime(STYLES[i].lp, ctx.currentTime, .3); wet.gain.setTargetAtTime(STYLES[i].wet, ctx.currentTime, .3); newBus(); if (timer) restart(); }
    if (!want){ want = true; } if (!playing) await on(); ui(); }
  // 面板
  sndPanel.innerHTML = `<div class="sp-head"><b>背景音樂</b><button type="button" class="sp-sw" role="switch"><i></i><span></span></button></div>
    <label class="sp-vol"><span>音量</span><input type="range" min="0" max="100" step="1" aria-label="音量"><em></em></label>
    <p class="sp-t">選一種曲風</p>
    <div class="sp-list">${STYLES.map((s, i) => `<button type="button" class="sp-st" data-i="${i}"><b>${s.name}</b><small>${s.desc}</small></button>`).join('')}</div>`;
  const sw = sndPanel.querySelector('.sp-sw'), rng = sndPanel.querySelector('input'), pct = sndPanel.querySelector('.sp-vol em');
  rng.value = vol;
  rng.addEventListener('input', () => setVol(+rng.value));
  sw.addEventListener('click', async () => { want = !(want && playing); if (want) await on(); else off(); ui(); });
  sndPanel.querySelectorAll('.sp-st').forEach(b => b.addEventListener('click', () => setStyle(+b.dataset.i)));
  ['pointerdown','touchstart','touchmove','wheel','keydown','click'].forEach(ev => sndPanel.addEventListener(ev, e => e.stopPropagation(), { passive: true }));
  function ui(){ const live = playing && vol > 0;
    sndBtn.classList.toggle('on', live); sndBtn.classList.toggle('off', !want || vol === 0);
    sndBtn.querySelector('.tx').textContent = !want ? '音樂已關' : (playing ? (vol === 0 ? '靜音' : '') : '輕觸開啟音樂');
    sndBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
    sw.classList.toggle('on', want && playing); sw.querySelector('span').textContent = want && playing ? '開' : '關';
    pct.textContent = vol + '%';
    sndPanel.querySelectorAll('.sp-st').forEach((b, i) => b.classList.toggle('cur', i === si)); }
  function panel(open){ sndPanel.hidden = !open; sndBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  async function press(){ if (want && !playing){ await on(); ui(); } panel(sndPanel.hidden); }
  document.addEventListener('pointerdown', e => { if (!sndPanel.hidden && !e.target.closest('#sndp, #snd')) panel(false); }, true);
  // 第一次碰螢幕（點、滑、按鍵）就開始播
  async function firstTouch(e){ if (e && e.target && e.target.closest && e.target.closest('#snd, #sndp')) return; if (want && !playing){ if (await on()) ui(); } if (playing) ['pointerdown','touchend','keydown','click'].forEach(ev => removeEventListener(ev, firstTouch, true)); }
  ['pointerdown','touchend','keydown','click'].forEach(ev => addEventListener(ev, firstTouch, true));
  document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else if (want && playing) ctx.resume(); });
  on().then(ui);   // 有些瀏覽器允許直接播
  ui();
  return { press };
})();
sndBtn.addEventListener('click', e => { e.stopPropagation(); Music.press(); });
</script>
