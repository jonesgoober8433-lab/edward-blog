<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#FFFAF0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>後台｜Edward 的 Blog</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261118165145">
<script src="config.js?v=20261118165145"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
</head>
<body>
<main><div class="wrap wide" id="root"><div class="empty">載入中…</div></div></main>

<template id="tplAdmin">
  <div class="admin">
    <aside class="side panel">
      <div class="side-head"><h2 style="margin:0">文章排序</h2><span style="display:flex;gap:6px"><button class="btn ghost sm" id="openBoard" title="拖曳文章，切換公開或 VIP">📂 公開／VIP</button><button class="btn sm" id="new">＋ 新文章</button></span></div>
      <p class="stamp" style="margin:0 0 8px">拖曳 ⠿ 或按 ▲▼ 調整順序（首頁由上到下）。「置頂」永遠排最前面。</p>
      <input id="filter" type="search" placeholder="找文章…" style="margin-bottom:8px">
      <ul class="plist" id="plist"></ul>
      <div style="border-top:1px solid var(--ln);margin-top:12px;padding-top:10px">
        <h2 style="font-size:16px;margin:0 0 6px">網站配色（一鍵切換）</h2>
        <div id="palettes" class="palettes"></div>
        <p class="stamp" style="margin:6px 0 0">按下去全網站立刻換色，訪客重新整理就會看到。<a href="themes.html" target="_blank">並排比較</a></p>
        <h2 style="font-size:16px;margin:12px 0 6px">深色風格（讀者手機是深色時）</h2>
        <div id="darks" class="palettes"></div>
        <p class="stamp" style="margin:6px 0 0"><a href="darkthemes.html" target="_blank">深色並排比較</a></p>
      </div>
      <div id="optBox" hidden style="border-top:1px solid var(--ln);margin-top:12px;padding-top:10px">
        <h2 style="font-size:16px;margin:0 0 4px">✨ 優化版待你審核</h2>
        <p class="stamp" style="margin:0 0 6px" id="optInfo"></p>
        <div id="optList"></div>
      </div>
      <div id="tidyBox" hidden style="border-top:1px solid var(--ln);margin-top:12px;padding-top:10px">
        <h2 style="font-size:16px;margin:0 0 4px">📏 斷句整理待審</h2>
        <p class="stamp" style="margin:0 0 6px" id="tidyInfo"></p>
        <div id="tidyList"></div>
      </div>
      <div id="importBox" hidden style="border-top:1px solid var(--ln);margin-top:12px;padding-top:10px">
        <h2 style="font-size:16px;margin:0 0 4px">從 Notion 搬家</h2>
        <p class="stamp" style="margin:0 0 6px" id="importInfo"></p>
        <button class="btn gold sm" id="importBtn">匯入 Notion 文章</button>
      </div>
      <div style="border-top:1px solid var(--ln);margin-top:12px;padding-top:10px">
        <h2 style="font-size:16px;margin:0 0 6px">👥 會員申請<span id="mreqN"></span></h2>
        <div id="members"></div>
      </div>
    </aside>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="左右拖曳調整寬度（點兩下恢復預設）"></div>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <h2 style="margin:0" id="edTitle">新文章</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn ghost sm" id="useTpl">📋 套用模板</button>
          <button class="btn ghost sm" id="saveTpl">💾 存成模板</button>
        </div>
      </div>
      <p class="stamp" id="stamps"></p>

      <label for="title">標題</label><input id="title" placeholder="例如：勞保年金到底領不領得到？">
      <label for="summary">摘要（顯示在文章卡片與搜尋結果）</label><textarea id="summary" rows="2"></textarea>
      <div class="row3">
        <div><label for="category">分類</label><select id="category"></select></div>
        <div><label for="tags">標籤（用逗號分開）</label><input id="tags" placeholder="勞保, 退休"></div>
        <div><label for="cover">封面圖片網址（可留空）</label><input id="cover" placeholder="https://…"></div>
      </div>
      <div class="row3" style="margin-top:12px">
        <div><label for="visibility">誰能看</label><select id="visibility"><option value="public">所有人（公開）</option><option value="members">VIP（只有核准的會員）</option></select></div>
        <div><label for="status">狀態</label><select id="status"><option value="draft">📝 草稿（只有你看得到）</option><option value="scheduled">⏰ 已預定發布（到時間自動上線）</option><option value="published">✅ 已發布</option></select></div>
        <div><label>&nbsp;</label><label class="check"><input type="checkbox" id="pinned"> 置頂（排在首頁最前面、大張顯示）</label></div>
      </div>

      <div class="modebar">
        <label style="margin:0">內文</label>
        <span style="display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;margin-right:8px">
          <button type="button" class="btn ghost sm" id="copyMd" title="把整篇（標題＋內文）轉成 Markdown 複製到剪貼簿">📋 複製 Markdown</button>
          <button type="button" class="btn ghost sm" id="tidyBtn" title="像 FB 貼文一樣：一行一個意思、短句、段落空一行">📏 一鍵斷句</button>
          <button type="button" class="btn ghost sm" id="tidyUndo" hidden>↩ 復原斷句</button>
          <button type="button" class="btn ghost sm" id="copyAi" title="複製全文＋審閱指令，直接貼給 AI">🤖 複製給 AI 審閱</button>
        </span>
        <div class="seg" role="group" aria-label="編輯模式"><button type="button" data-mode="md" class="on">Markdown（給 AI 貼大綱）</button><button type="button" data-mode="visual">視覺編輯（顏色、字級）</button></div>
      </div>
      <div id="mdPane">
        <div class="toolbar">
          <button class="btn ghost sm" data-ins="h2">大標</button>
          <button class="btn ghost sm" data-ins="h3">小標</button>
          <button class="btn ghost sm" data-ins="b">粗體</button>
          <button class="btn ghost sm" data-ins="ul">條列</button>
          <button class="btn ghost sm" data-ins="ol">編號</button>
          <button class="btn ghost sm" data-ins="q">引言框</button>
          <button class="btn ghost sm" data-ins="a">連結</button>
          <button class="btn ghost sm" data-ins="img">圖片</button>
          <button class="btn ghost sm" data-ins="tbl">表格</button>
          <span class="sep"></span>
          <label class="btn gold sm" title="也可以直接 Command＋V 貼上，或從照片 App 拖進來">🖼 上傳圖片<input type="file" id="pickImg" accept="image/*,video/*" multiple hidden></label>
          <button class="btn ghost sm" data-media-lib type="button">📚 照片庫</button>
          <button class="btn ghost sm" data-video type="button">🎬 YouTube</button>
        </div>
        <p class="stamp" style="margin:0 0 6px">圖片大小：在說明後面加 <code>|小</code> <code>|中</code> <code>|大</code>，例如 <code>![填表範例|中](…)</code>；兩張以上連在一起會自動並排。</p>
        <div class="editor">
          <textarea id="body" placeholder="從這裡開始寫…（AI 給的 Markdown 大綱直接整段貼上）"></textarea>
          <div class="preview prose" id="preview"></div>
        </div>
      </div>
      <div id="visPane" hidden>
        <div class="vtool">
          <select id="vBlock" title="段落樣式"><option value="P">內文</option><option value="H2">大標</option><option value="H3">小標</option><option value="BLOCKQUOTE">引言框</option></select>
          <select id="vSize" title="文字大小"><option value="">字級</option><option value="2">小</option><option value="3">標準</option><option value="5">大</option><option value="6">特大</option></select>
          <span class="sep"></span>
          <button class="btn ghost sm" data-cmd="bold"><b>B</b></button>
          <button class="btn ghost sm" data-cmd="italic"><i>I</i></button>
          <button class="btn ghost sm" data-cmd="strikeThrough"><s>S</s></button>
          <span class="sep"></span>
          <button class="sw" data-color="#14284B" title="深藍" style="background:#14284B"></button>
          <button class="sw" data-color="#B08A4E" title="金色" style="background:#B08A4E"></button>
          <button class="sw" data-color="#B23B3B" title="紅色" style="background:#B23B3B"></button>
          <button class="sw" data-color="#2E7D5B" title="綠色" style="background:#2E7D5B"></button>
          <input type="color" id="vColor" value="#1F3A68" title="自選顏色">
          <button class="btn ghost sm" data-cmd="hiliteColor" title="螢光筆">螢光</button>
          <span class="sep"></span>
          <button class="btn ghost sm" data-cmd="insertUnorderedList">條列</button>
          <button class="btn ghost sm" data-cmd="insertOrderedList">編號</button>
          <button class="btn ghost sm" data-cmd="link">連結</button>
          <label class="btn gold sm" title="也可以直接 Command＋V 貼上，或從照片 App 拖進來">🖼 上傳圖片<input type="file" id="pickImg2" accept="image/*,video/*" multiple hidden></label>
          <button class="btn ghost sm" data-media-lib type="button">📚 照片庫</button>
          <button class="btn ghost sm" data-video type="button">🎬 YouTube</button>
          <select id="vImgSize" title="先點一下文章裡的圖片，再選大小"><option value="">圖片大小</option><option value="s">小</option><option value="m">中</option><option value="l">大（滿版）</option><option value="0">原尺寸</option></select>
          <button class="btn ghost sm" data-cmd="removeFormat" title="清除選取文字的顏色、字級">清除格式</button>
        </div>
        <div class="visual prose" id="visual" contenteditable="true" data-ph="從這裡開始寫…選取文字後用上面的按鈕改顏色、字級"></div>
      </div>

      <div class="actions">
        <button class="btn danger sm" id="del">刪除</button>
        <span style="flex:1"></span>
        <a class="btn ghost" id="view" target="_blank">看文章頁</a>
        <button class="btn ghost" id="saveDraft">存成草稿</button>
      </div>
      <div class="pub-row">
        <div class="sched"><label for="schedAt" style="margin:0">⏰ 定時發布</label><input type="datetime-local" id="schedAt"><button class="btn ghost sm" id="schedClear" type="button">清除</button></div>
        <button class="btn" id="publish">立即發布</button>
      </div>
      <p class="stamp" id="schedHint" style="text-align:right;margin:6px 0 0">留空＝按下就立刻上線；選了時間＝到時間自動上線</p>
    </section>
  </div>

  <dialog id="dlgTpl">
    <h2 style="margin-top:0">我的模板</h2>
    <p class="stamp">套用後會換掉目前的內文、分類、標籤和「誰能看」，標題不動。</p>
    <div id="tplList"></div>
    <div class="actions"><button class="btn ghost" data-close>關閉</button></div>
  </dialog>
  <button type="button" class="dv-tab" id="dvTab" aria-controls="dvPanel" aria-expanded="false" title="裝置預覽：看手機、平板、電腦上長什麼樣子">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>預覽</span>
  </button>
  <aside class="dv-panel" id="dvPanel" aria-label="裝置預覽">
    <div class="dv-head">
      <span class="seg" id="dvSeg"><button type="button" data-dev="phone" class="on">📱 手機</button><button type="button" data-dev="tablet">平板</button><button type="button" data-dev="desktop">💻 電腦</button></span>
      <span class="stamp" id="dvInfo"></span>
      <button type="button" class="btn ghost sm" id="dvClose">收起 ✕</button>
    </div>
    <div class="dv-stage" id="dvStage"><div class="dv-device" id="dvDevice"><iframe id="dvFrame" title="裝置預覽" src="about:blank"></iframe></div></div>
  </aside>
  <dialog id="dlgBoard" style="max-width:1100px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><h2 style="margin:0">📂 文章分類：公開 ／ VIP</h2><p class="stamp" style="margin:2px 0 0">把文章拖到另一邊就立刻生效（手機請按卡片上的「移到 →」）。</p></div>
      <button class="btn ghost sm" data-close>關閉</button>
    </div>
    <div class="board">
      <section class="lane" data-vis="public"><h3>🌐 公開<small>所有人都能看</small><span class="lane-n"></span></h3><div class="lane-body"></div></section>
      <section class="lane vip" data-vis="members"><h3>🔒 VIP<small>只有你核准的會員能看</small><span class="lane-n"></span></h3><div class="lane-body"></div></section>
    </div>
  </dialog>
  <dialog id="dlgVideo">
    <h2 style="margin-top:0">🎬 插入 YouTube</h2>
    <label for="vidUrl">YouTube 網址</label><input id="vidUrl" placeholder="https://www.youtube.com/watch?v=…">
    <label for="vidTitle">顯示文字（書籤、超連結用；留空會用影片名稱）</label><input id="vidTitle" placeholder="例如：72 法則 3 分鐘教學">
    <label>讀者看到的樣子</label>
    <div class="vidopts">
      <label class="vopt"><input type="radio" name="vidMode" value="video" checked><span><b>影片</b><small>直接在文章裡播放</small></span></label>
      <label class="vopt"><input type="radio" name="vidMode" value="bookmark"><span><b>書籤卡片</b><small>縮圖＋標題，點了到 YouTube</small></span></label>
      <label class="vopt"><input type="radio" name="vidMode" value="link"><span><b>超連結</b><small>一行文字連結，最低調</small></span></label>
    </div>
    <p class="msgbox">📌 影片「檔案」不能直接上傳（免費方案放不下），請先傳到 YouTube（不想公開可選「不公開」），再把網址貼在這裡。</p>
    <div class="actions"><button class="btn ghost" data-close>取消</button><button class="btn" id="vidOk">插入</button></div>
  </dialog>
  <dialog id="dlgVidFile">
    <h2 style="margin-top:0">🎬 影片檔要先傳到 YouTube</h2>
    <p>你選了影片檔 <b id="vidFileName"></b>。免費方案放不下影片檔，照這 3 步就好：</p>
    <ol><li>到 YouTube Studio 上傳這支影片（不想公開就選<b>「不公開」</b>，只有拿到連結的人看得到）</li>
      <li>上傳完，複製影片網址</li>
      <li>回來按「🎬 YouTube」，貼上網址，選「影片」</li></ol>
    <div class="actions"><a class="btn ghost" href="https://studio.youtube.com/" target="_blank" rel="noopener">打開 YouTube Studio</a><button class="btn" data-close>知道了</button></div>
  </dialog>
  <dialog id="dlgMedia" style="max-width:1100px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><h2 style="margin:0">📚 照片庫</h2><span class="stamp" id="mediaCount"></span></div>
      <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="seg mfilter"><button class="on" data-f="all">全部</button><button data-f="used">有用到</button><button data-f="unused">沒用到</button></span>
        <label class="btn gold sm">上傳照片<input type="file" id="mediaUpload" accept="image/*,video/*" multiple hidden></label>
        <button class="btn ghost sm" data-close>關閉</button>
      </span>
    </div>
    <p class="msgbox" id="mediaNote" hidden></p>
    <p class="stamp" style="margin:6px 0">上傳時會自動檢查重複（同一個檔案，或同一張照片縮放、另存過都抓得到）。每張下面都寫著「用在哪篇文章」。</p>
    <div class="mgrid" id="mediaGrid"></div>
  </dialog>
  <dialog id="dlgOpt" style="max-width:1200px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 style="margin:0" id="optTitle"></h2>
      <span style="display:flex;gap:6px"><button class="btn ghost sm" data-close>先不要</button><button class="btn sm" id="optApply">套用優化版</button></span>
    </div>
    <div class="optnotes"><div><b>改了什麼</b><ul id="optChanges"></ul></div><div><b>⚠️ 請你查證</b><ul id="optChecks"></ul></div></div>
    <details class="fixes" id="optFixWrap" open><summary>🔍 查證修正（<span id="optFixN">0</span> 處）：改之前 → 改之後，附來源</summary><div id="optFixes"></div></details>
    <div class="cmp"><div><div class="cmph">原文（目前網站上）</div><div class="prose" id="optOld"></div></div><div><div class="cmph new">優化版</div><div class="prose" id="optNew"></div></div></div>
  </dialog>
  <dialog id="dlgSave">
    <h2 style="margin-top:0">存成模板</h2>
    <p class="stamp">會記住目前的內文、分類、標籤和「誰能看」，下次寫新文章一鍵套用。</p>
    <label for="tplName">模板名稱</label><input id="tplName" placeholder="例如：社會保險系列">
    <div class="actions"><button class="btn ghost" data-close>取消</button><button class="btn" id="tplOk">儲存模板</button></div>
  </dialog>
</template>

<script type="module">
import { store, MODE, newId, isLive } from "./assets/store.js?v=20261118165145";
import { header, footer, esc, fmtTime, md, toast, PALETTES, applyPalette, DARKS, applyDark, hydrateMedia, ytId, rememberMedia } from "./assets/ui.js?v=20261118165145";
import { tidyLines } from "./assets/tidy.js?v=20261118165145";
import { initMedia } from "./assets/media.js?v=20261118165145";
const CFG = window.BLOG_CONFIG;
header("admin"); footer();
const root = document.getElementById("root");
let started = false;

store.onAuth(u => {
  if (!u) { location.href = "login.html?next=admin.html"; return; }
  if (!u.isAdmin) { root.innerHTML = `<div class="paywall" style="margin:40px auto;max-width:520px"><h3>這裡是管理員後台</h3><p>你的帳號是一般會員。${MODE === "firebase" ? "要把帳號設成管理員，請照 README.md 第 4 步到 Firebase 加上 roles。" : ""}</p><a class="btn" href="member.html">去會員專區</a></div>`; return; }
  if (!started) { started = true; start(); }
});

function start() {
  root.innerHTML = document.getElementById("tplAdmin").innerHTML;
  const $ = id => document.getElementById(id);
  const F = ["title", "summary", "category", "tags", "cover", "visibility", "body"];
  const stateOf = p => p.status !== "published" ? "draft" : isLive(p) ? "published" : "scheduled";
  const STATE_LABEL = p => ({ draft: `<span class="st st-draft">📝 草稿</span>`, scheduled: `<span class="st st-sched">⏰ 已預定發布 ${fmtTime(p.publishedAt)}</span>`, published: `<span class="st st-pub">✅ 已發布</span>` })[stateOf(p)];
  $("category").innerHTML = CFG.categories.map(c => `<option>${esc(c)}</option>`).join("");
  let posts = [], cur = null, dirty = false;

  const blank = () => ({ id: null, title: "", summary: "", category: CFG.categories[0], tags: [], cover: "", visibility: "public", status: "draft", pinned: false, body: "" });

  async function refresh(selectId) {
    posts = await store.listPosts({ all: true });
    drawList();
    if (selectId) open(posts.find(p => p.id === selectId) ? selectId : null);
    drawMembers();
  }

  function drawList() {
    const v = $("filter").value.trim().toLowerCase();
    $("plist").innerHTML = posts.filter(p => !v || (p.title + (p.tags || []).join(" ")).toLowerCase().includes(v)).map(p => `
      <li draggable="true" data-id="${esc(p.id)}" class="${cur?.id === p.id ? "sel" : ""}">
        <span class="grip" title="拖曳排序">⠿</span>
        <div class="t"><b>${p.pinned ? "📌 " : ""}${esc(p.title || "（未命名）")}</b>
          <small>${STATE_LABEL(p)}${p.visibility === "members" ? "・會員" : ""}・更新 ${fmtTime(p.updatedAt)}</small></div>
        <span class="mv"><button data-mv="-1" title="往上">▲</button><button data-mv="1" title="往下">▼</button></span>
      </li>`).join("") || `<li class="stamp" style="cursor:default">還沒有文章</li>`;
  }

  async function drawDarks() {
    const cur = (await store.getSettings()).dark || CFG.darkStyle || "oled";
    $("darks").innerHTML = DARKS.map(([k, n, a, b]) => `<button class="pal ${k === cur ? "on" : ""}" data-dk="${k}" title="${esc(n)}"><span class="sw2" style="background:linear-gradient(135deg,${a} 60%,${b} 60%);border:1px solid var(--ln)"></span>${esc(n.split("｜")[1])}</button>`).join("");
  }
  $("darks").addEventListener("click", async e => {
    const b = e.target.closest("[data-dk]"); if (!b) return;
    try { await store.saveSettings({ dark: b.dataset.dk }); applyDark(b.dataset.dk); drawDarks(); toast("深色風格已切換 ✓（讀者手機是深色模式時會看到）"); }
    catch (err) { toast("切換失敗：" + err.message, true); }
  });
  drawDarks();

  // 記住 Markdown 編輯框的游標位置（按按鈕、開對話框後插入的內容會放回游標處）
  let mdSel = null;
  ["keyup", "click", "select", "blur", "input"].forEach(ev => $("body").addEventListener(ev, () => { mdSel = [$("body").selectionStart, $("body").selectionEnd]; }));
  function insertAtCursor(text) {
    const ta = $("body"); const [a, b] = mdSel || [ta.value.length, ta.value.length];
    ta.focus(); ta.setRangeText(text, a, b, "end"); mdSel = [ta.selectionStart, ta.selectionEnd]; preview(); dirty = true;
  }
  // ---------- 照片庫、上傳圖片、影片 ----------
  const bodyCache = {};
  const media = initMedia({
    store, $,
    getMode: () => mode,
    insertMd: text => insertAtCursor(text),
    insertVisual: html => exec("insertHTML", html),
    getPostsWithBody: async () => [...(cur && !cur.id ? [{ id: "__cur", title: "目前這篇（還沒儲存）", body: mode === "visual" ? td.turndown($("visual").innerHTML) : $("body").value }] : []), ...await Promise.all(posts.map(async p => {
      if (cur?.id === p.id) return { ...p, body: mode === "visual" ? td.turndown($("visual").innerHTML) : $("body").value };
      if (!(p.id in bodyCache) || bodyCache[p.id].u !== p.updatedAt) bodyCache[p.id] = { u: p.updatedAt, b: (await store.getPost(p.id))?.body || "" };
      return { ...p, body: bodyCache[p.id].b };
    }))],
    onChange: () => { dirty = true; },
    onVideoFile: vids => { $("vidFileName").textContent = vids.map(v => v.name).join("、"); $("dlgVidFile").showModal(); },
  });
  document.querySelectorAll("[data-media-lib]").forEach(b => b.onclick = () => media.openLib());
  $("pickImg2").addEventListener("change", e => { media.upload(e.target.files); e.target.value = ""; });
  document.querySelectorAll("[data-video]").forEach(b => b.onclick = () => { $("vidUrl").value = ""; $("vidTitle").value = ""; $("dlgVideo").showModal(); $("vidUrl").focus(); });
  $("vidOk").onclick = async () => {
    const u = $("vidUrl").value.trim(), m = document.querySelector('input[name="vidMode"]:checked').value;
    if (!ytId(u)) return toast("看不懂這個網址，請貼 YouTube 影片的網址", true);
    let t = $("vidTitle").value.trim();
    if (!t && m !== "video") {   // 自動抓影片名稱（抓不到就用「YouTube 影片」）
      try { t = (await (await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(u))).json()).title || ""; } catch (e) { }
      t = t || "YouTube 影片";
    }
    t = t.replace(/[\[\]]/g, "");
    const mdText = m === "video" ? `🎬 ${u}` : m === "bookmark" ? `🔖 [${t}](${u})` : `[${t}](${u})`;
    const html = m === "video" ? `<p>🎬 <a href="${esc(u)}">${esc(u)}</a></p>` : m === "bookmark" ? `<p>🔖 <a href="${esc(u)}">${esc(t)}</a></p>` : `<a href="${esc(u)}">${esc(t)}</a>`;
    $("dlgVideo").close();
    if (mode === "visual") exec("insertHTML", html);
    else insertAtCursor(m === "link" ? mdText : `\n\n${mdText}\n\n`);
    dirty = true; toast({ video: "已插入影片 ✓", bookmark: "已插入書籤卡片 ✓", link: "已插入超連結 ✓" }[m]);
  };
  // 一鍵複製：Markdown／給 AI 審閱
  function currentMd() { return mode === "visual" ? td.turndown($("visual").innerHTML).replace(/\n{3,}/g, "\n\n").trim() + "\n" : $("body").value; }
  async function copyText(t, okMsg) {
    try { await navigator.clipboard.writeText(t); toast(okMsg); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast(okMsg); }
  }
  let tidyPrev = null;
  $("tidyBtn").onclick = () => {
    const before = currentMd(), after = tidyLines(before);
    if (after === before) { toast("這篇已經斷得很乾淨了 ✓"); return; }
    tidyPrev = before; $("body").value = after; if (mode === "visual") toVisual();
    root.dispatchEvent(new Event("input", { bubbles: true })); $("tidyUndo").hidden = false;
    toast("已斷句 ✓ 記得按儲存；不滿意可以按「↩ 復原斷句」");
  };
  $("tidyUndo").onclick = () => { if (tidyPrev == null) return; $("body").value = tidyPrev; if (mode === "visual") toVisual(); tidyPrev = null; $("tidyUndo").hidden = true; root.dispatchEvent(new Event("input", { bubbles: true })); toast("已復原"); };
  $("copyMd").onclick = () => copyText(`# ${$("title").value.trim()}\n\n${currentMd()}`, "已複製 Markdown ✓（可以直接貼到任何地方）");
  $("copyAi").onclick = () => copyText(`請幫我審閱下面這篇部落格文章（Markdown 格式）。
我是台灣的財務顧問 Edward，讀者是上班族、小資族與高資產家庭。
請檢查：①錯字與用語 ②數字、法規、日期有沒有過時或錯誤（列出需要查證的句子）③段落結構與小標是否好讀 ④開頭是否吸引人、結尾是否自然導向預約諮詢。
請保留我的語氣，最後「整篇用 Markdown 輸出修改後的版本」，我會直接貼回後台。
圖片那行（![...](...)）和 🎬／🔖 開頭的影片、書籤行請原封不動保留。

---
標題：${$("title").value.trim()}
摘要：${$("summary").value.trim()}

${currentMd()}`, "已複製給 AI 審閱 ✓（貼給 ChatGPT／Gemini／Claude 都可以）");
  let selImg = null;
  $("visual").addEventListener("click", e => { document.querySelectorAll("#visual img.sel").forEach(i => i.classList.remove("sel")); selImg = e.target.closest("img"); selImg?.classList.add("sel"); });
  $("vImgSize").addEventListener("change", e => {
    const v = e.target.value; e.target.value = "";
    if (!selImg) return toast("先點一下文章裡要調整的圖片", true);
    selImg.classList.remove("img-s", "img-m", "img-l"); if (v !== "0") selImg.classList.add("img-" + v); dirty = true;
  });

  // ---------- 裝置預覽（右邊隱藏面板）----------
  const DEV = { phone: [390, 844, "手機 390×844"], tablet: [820, 1180, "平板 820×1180"], desktop: [1366, 860, "電腦 1366×860"] };
  let dev = "phone", dvReady = false, dvTimer = null;
  try { dev = localStorage.getItem("eb-dv-dev") || "phone"; } catch (e) { }
  function fitDevice() {
    const [w, h, label] = DEV[dev], st = $("dvStage");
    const sc = Math.min(1, (st.clientWidth - 24) / w, (st.clientHeight - 24) / h);
    $("dvDevice").style.width = w * sc + "px"; $("dvDevice").style.height = h * sc + "px";
    $("dvFrame").style.width = w + "px"; $("dvFrame").style.height = h + "px"; $("dvFrame").style.transform = `scale(${sc})`;
    $("dvDevice").className = "dv-device " + dev;
    $("dvInfo").textContent = `${label}（縮放 ${Math.round(sc * 100)}%）`;
    document.querySelectorAll("#dvSeg [data-dev]").forEach(b => b.classList.toggle("on", b.dataset.dev === dev));
  }
  function pushPreview() {
    if (!dvReady || !document.body.classList.contains("dv-open")) return;
    const body = mode === "visual" ? td.turndown($("visual").innerHTML) : $("body").value;
    const p = { ...cur, title: $("title").value, summary: $("summary").value, category: $("category").value, cover: $("cover").value,
      tags: $("tags").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean), visibility: $("visibility").value, status: $("status").value === "draft" ? "draft" : "published", body, locked: false };
    const live = posts.filter(x => x.status === "published");
    const i = live.findIndex(x => x.id === cur?.id), nx = live.length ? live[(i + 1) % live.length] : null;
    $("dvFrame").contentWindow.postMessage({ type: "eb-preview", post: p, next: nx && nx.id !== cur?.id ? { id: nx.id, title: nx.title } : null }, location.origin);
  }
  addEventListener("message", e => { if (e.origin === location.origin && e.data?.type === "eb-preview-ready") { dvReady = true; pushPreview(); } });
  function openDv(show) {
    document.body.classList.toggle("dv-open", show);
    $("dvTab").setAttribute("aria-expanded", String(show));
    if (show) {
      if ($("dvFrame").getAttribute("src") === "about:blank") { dvReady = false; $("dvFrame").src = "preview.html"; }
      setTimeout(() => { fitDevice(); pushPreview(); }, 30); setTimeout(fitDevice, 320);
    }
  }
  $("dvTab").onclick = () => openDv(!document.body.classList.contains("dv-open"));
  $("dvClose").onclick = () => openDv(false);
  $("dvSeg").addEventListener("click", e => { const b = e.target.closest("[data-dev]"); if (!b) return; dev = b.dataset.dev; try { localStorage.setItem("eb-dv-dev", dev); } catch (e) { } fitDevice(); });
  addEventListener("resize", () => { if (document.body.classList.contains("dv-open")) fitDevice(); });
  root.addEventListener("input", () => { clearTimeout(dvTimer); dvTimer = setTimeout(pushPreview, 500); });
  new MutationObserver(() => { clearTimeout(dvTimer); dvTimer = setTimeout(pushPreview, 600); }).observe($("visual"), { childList: true, subtree: true, characterData: true, attributes: true });
  window.__ebPushPreview = pushPreview;

  // ---------- 優化版審核 ----------
  let optList = [];
  async function checkOpt() {
    let all = [];
    try { all = await (await fetch("import/optimized.json", { cache: "no-store" })).json(); } catch (e) { return; }
    optList = all.filter(o => { const p = posts.find(x => x.id === o.id); return p && (p.optRev || 0) < (o.rev || 1); });
    $("optBox").hidden = !optList.length;
    $("optInfo").textContent = `${optList.length} 篇整理好了，點開看「原文 vs 優化版」，滿意再套用。`;
    $("optList").innerHTML = optList.map(o => `<div class="tpl"><span>${esc(o.title)}${o.checks?.length ? ` <span class="badge draft">查證 ${o.checks.length}</span>` : ""}</span><button class="btn ghost sm" data-opt="${esc(o.id)}">對照</button></div>`).join("")
      + (optList.length > 1 ? `<p style="margin:8px 0 0"><button class="btn gold sm" id="optAll">全部套用（${optList.length} 篇）</button></p>` : "");
  }
  async function applyOpt(o) {
    const p = await store.getPost(o.id); if (!p) throw new Error("找不到原文");
    delete p.locked;
    if (o.tidy) { await store.savePost({ ...p, body: o.body, updatedAt: Date.now() }); return; }
    await store.savePost({ ...p, title: o.newTitle || p.title, summary: o.summary, body: tidyLines(o.body), updatedAt: Date.now(), optRev: o.rev || 1 });
  }
  // ---------- 斷句整理：網站上的文章，斷句前後不一樣的就列出來 ----------
  let tidyItems = [];
  async function checkTidy() {
    tidyItems = [];
    for (const m of posts) {
      const p = await store.getPost(m.id); if (!p || p.locked || !p.body) continue;
      const t = tidyLines(p.body); if (t !== p.body) tidyItems.push({ id: p.id, title: p.title, summary: p.summary, body: t, tidy: true,
        changes: ["一行一個意思：句號、問號、驚嘆號後換行，行尾句號拿掉", "逗號分開的短句：太長才換行，短的留在同一行", "標題、清單、圖片、表格不動，段落空行保留"] });
    }
    $("tidyBox").hidden = !tidyItems.length;
    $("tidyInfo").textContent = `${tidyItems.length} 篇可以斷得更乾淨（像 FB 貼文）。點「對照」看前後，滿意再套用。`;
    $("tidyList").innerHTML = tidyItems.map(o => `<div class="tpl"><span>${esc(o.title)}</span><button class="btn ghost sm" data-tidy="${esc(o.id)}">對照</button></div>`).join("")
      + (tidyItems.length > 1 ? `<p style="margin:8px 0 0"><button class="btn gold sm" id="tidyAll">全部套用（${tidyItems.length} 篇）</button></p>` : "");
  }
  $("tidyList").addEventListener("click", async e => {
    if (e.target.id === "tidyAll") {
      if (!confirm(`把 ${tidyItems.length} 篇全部換成斷句版？\n（只改換行和行尾句號，不改文字）`)) return;
      e.target.disabled = true; let n = 0;
      try { for (const o of tidyItems) { await applyOpt(o); n++; e.target.textContent = `套用中… ${n}/${tidyItems.length}`; } toast(`已套用 ${n} 篇 ✓`); }
      catch (err) { toast(`第 ${n + 1} 篇失敗：${err.message}`, true); }
      await refresh(); checkTidy(); return;
    }
    const b = e.target.closest("[data-tidy]"); if (!b) return;
    curOpt = tidyItems.find(o => o.id === b.dataset.tidy);
    const p = await store.getPost(curOpt.id);
    $("optTitle").textContent = "📏 斷句整理：" + curOpt.title;
    $("optChanges").innerHTML = curOpt.changes.map(c => `<li>${esc(c)}</li>`).join("");
    $("optChecks").innerHTML = "<li>自動斷句，個別句子不滿意：套用後到編輯器直接改就好</li>";
    $("optFixWrap").hidden = true;
    $("optOld").innerHTML = md(p?.body || ""); $("optNew").innerHTML = md(curOpt.body);
    $("optApply").textContent = "套用斷句版"; document.querySelector("#dlgOpt .cmph.new").textContent = "斷句版";
    $("dlgOpt").showModal(); $("dlgOpt").scrollTop = 0;
  });
  let curOpt = null;
  $("optList").addEventListener("click", async e => {
    if (e.target.id === "optAll") {
      if (!confirm(`把 ${optList.length} 篇全部換成優化版？\n（原文備份在 import/notion-posts.json，隨時可以請小Edward 還原）`)) return;
      e.target.disabled = true; let n = 0;
      try { for (const o of optList) { await applyOpt(o); n++; e.target.textContent = `套用中… ${n}/${optList.length}`; } toast(`已套用 ${n} 篇 ✓`); }
      catch (err) { toast(`第 ${n + 1} 篇失敗：${err.message}`, true); }
      await refresh(); checkOpt(); return;
    }
    const b = e.target.closest("[data-opt]"); if (!b) return;
    curOpt = optList.find(o => o.id === b.dataset.opt);
    const p = await store.getPost(curOpt.id);
    $("optTitle").textContent = curOpt.newTitle ? `${curOpt.title} → 新標題：${curOpt.newTitle}` : curOpt.title;
    $("optChanges").innerHTML = (curOpt.changes || []).map(c => `<li>${esc(c)}</li>`).join("") || "<li>—</li>";
    $("optChecks").innerHTML = (curOpt.checks || []).map(c => `<li>${esc(c)}</li>`).join("") || "<li>沒有</li>";
    const fx = curOpt.fixes || [];
    $("optFixWrap").hidden = !fx.length; $("optFixN").textContent = fx.length;
    $("optFixes").innerHTML = fx.map((f, i) => `<div class="fix"><span class="fix-t">${i + 1}．${esc(f.type || "修改")}</span>
      <div class="fix-ba"><del>${esc(f.before)}</del><span class="fix-arrow">→</span><ins>${esc(f.after || "（刪除）")}</ins></div>
      <p class="stamp">${esc(f.why || "")}${(f.sources || []).length ? "　來源：" + f.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}${s.date ? "（" + esc(s.date) + "）" : ""}</a>`).join("、") : ""}</p></div>`).join("");
    $("optOld").innerHTML = `<p class="stamp"><b>摘要：</b>${esc(p?.summary || "")}</p>` + md(p?.body || "");
    $("optNew").innerHTML = `<p class="stamp"><b>摘要：</b>${esc(curOpt.summary)}</p>` + md(tidyLines(curOpt.body));
    $("optApply").textContent = "套用優化版"; document.querySelector("#dlgOpt .cmph.new").textContent = "優化版";
    $("dlgOpt").showModal(); $("dlgOpt").scrollTop = 0;
  });
  $("optApply").onclick = async () => {
    try { await applyOpt(curOpt); toast("已套用 ✓"); $("dlgOpt").close(); await refresh(); curOpt.tidy ? checkTidy() : checkOpt(); if (cur?.id === curOpt.id) open(cur.id); }
    catch (err) { toast("套用失敗：" + err.message, true); }
  };

  // ---------- 從 Notion 匯入 ----------
  let importList = [];
  async function checkImport() {
    try { importList = await (await fetch("import/notion-posts.json", { cache: "no-store" })).json(); } catch (e) { return; }
    const left = []; for (const p of importList) if (!(await store.exists(p.id))) left.push(p);
    importList = left;
    $("importBox").hidden = !left.length;
    $("importInfo").textContent = `還有 ${left.length} 篇 Notion 文章可以匯入（含圖片、原本的發布日期與順序）。`;
  }
  $("importBtn").onclick = async () => {
    if (!importList.length || !confirm(`匯入 ${importList.length} 篇 Notion 文章？已經匯入過的不會重複。`)) return;
    $("importBtn").disabled = true; let n = 0;
    try {
      for (const p of importList) { const { source, ...post } = p; await store.savePost(post); n++; $("importInfo").textContent = `匯入中… ${n} / ${importList.length}`; }
      toast(`已匯入 ${n} 篇 ✓`);
    } catch (e) { toast(`第 ${n + 1} 篇失敗：${e.message}`, true); }
    $("importBtn").disabled = false; await refresh(); checkImport();
  };

  refresh().then(async () => {
    const q = new URLSearchParams(location.search);
    open(q.get("id")); checkImport(); await checkOpt(); checkTidy();
    // 網址帶 ?opt=文章ID：直接打開那篇的「原文 vs 優化版」對照
    const want = q.get("opt");
    if (want) { const b = document.querySelector(`[data-opt="${CSS.escape(want)}"]`); if (b) b.click(); else toast("這篇已經套用過優化版了 ✓"); }
  });
}
</script>
</body>
</html>
