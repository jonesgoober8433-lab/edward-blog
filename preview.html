<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#FFFAF0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>預覽｜Edward 的 Blog</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261118092841">
<script src="config.js?v=20261118092841"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<main><article class="wrap narrow article" id="art"><div class="empty">等待後台傳來文章內容…</div></article></main>
<script type="module">
// 後台「裝置預覽」用：接收後台目前正在寫的內容（還沒存也看得到），用跟正式文章頁一模一樣的畫面顯示
import { header, footer } from "./assets/ui.js?v=20261118092841";
import { renderArticle } from "./assets/article.js?v=20261118092841";
const CFG = window.BLOG_CONFIG;
header("home"); footer();
document.querySelector(".demo-bar")?.remove();
const art = document.getElementById("art");
let lastScroll = 0;
addEventListener("message", e => {
  if (e.origin !== location.origin || e.data?.type !== "eb-preview") return;
  lastScroll = scrollY;
  renderArticle(art, e.data.post, { CFG, next: e.data.next });
  document.title = (e.data.post.title || "預覽") + "｜預覽";
  scrollTo(0, lastScroll);
});
parent.postMessage({ type: "eb-preview-ready" }, location.origin);
</script>
</body>
</html>
