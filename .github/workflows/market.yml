# 每天台灣 07:37、08:17、08:47、09:23、10:53，以及雲端早報推上來時抓收盤數字，給 09:00 的雲端早報與首頁台股長期走勢用
name: 收盤數字
on:
  schedule:
    # GitHub 免費排程常延遲或跳過（11/19 早上兩次都沒跑），所以避開整點、多跑幾次
    - cron: "37 23 * * *"
    - cron: "17 0 * * *"
    - cron: "47 0 * * *"
    - cron: "23 1 * * *"
    - cron: "53 2 * * *"
  # 防呆（2026-11-19）：排程常跳過，所以雲端早報一推上來就再抓一次，並補進今天的早報
  push:
    branches: [main]
    paths: ["briefs/data/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 briefs/tools/market.py --write
      - name: 補進今天的早報
        run: python3 briefs/tools/refresh_brief_market.py
      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs/market/latest.json briefs/market/twii.json briefs/market/us.json briefs/data/
          git diff --cached --quiet || git commit -m "收盤數字 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main && git push
