<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#FFFAF0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>早報後台｜Edward 的 Blog</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261118233500">
<script src="config.js?v=20261118165907"></script>
</head>
<body>
<main><div class="wrap wide" id="root"><div class="empty">載入中…</div></div></main>
<template id="tpl">
  <div class="ba">
    <section class="panel">
      <div class="ba-top">
        <div><h2 style="margin:0">📰 每日財經早報</h2><p class="stamp" id="status" style="margin:4px 0 0"></p></div>
        <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <select id="date" aria-label="選日期"></select>
          <a class="btn ghost sm" id="view" target="_blank">看讀者畫面</a>
        </span>
      </div>
      <label for="headline">今日一句話重點（顯示在最上面）</label><input id="headline">
      <h3 style="margin:18px 0 6px">候選新聞：勾選今天要上的（建議 3～4 則）</h3>
      <p class="stamp" style="margin:0 0 8px">每則都附「放的好處／壞處」。想改內容就按每則右上角的「✏️ 編輯」，改完按「✓ 完成編輯」，最後再存檔。已勾 <b id="nPick">0</b> 則。</p>
      <div id="cands"></div>
      <h3 style="margin:18px 0 6px">📚 今日財經小知識</h3>
      <div class="row2"><div><label for="kTerm">名詞</label><input id="kTerm"></div><div><label for="kEx">例子</label><input id="kEx"></div></div>
      <label for="kExp">白話解釋</label><textarea id="kExp" rows="3"></textarea>
      <div class="actions">
        <button class="btn danger sm" id="reset">恢復小Edward 的原始版</button>
        <span style="flex:1"></span>
        <button class="btn ghost" id="saveDraft">存檔（先不公開）</button>
        <button class="btn gold" id="publishAt10" title="現在先存好，當天台灣時間 10:00 自動上線">⏰ 存檔並 10:00 發布</button>
        <button class="btn" id="publish">存檔並發布</button>
      </div>
    </section>
    <aside class="panel">
      <h2 style="font-size:18px;margin:0 0 6px">🧭 給小Edward 的方向建議</h2>
      <p class="stamp" style="margin:0 0 6px">寫下你希望早報多放／少放什麼，雲端排程每天 09:00 產生候選時都會照這裡調整。</p>
      <textarea id="direction" rows="7" placeholder="例如：多放跟台灣上班族有關的（勞保、房貸利率）；美股個股少放；每天至少一則匯率。"></textarea>
      <button class="btn sm" id="saveDir" style="margin-top:8px">儲存方向</button>
      <h2 style="font-size:18px;margin:20px 0 6px">怎麼運作</h2>
      <ol class="stamp" style="padding-left:18px;margin:0">
        <li>每天 09:00 雲端自動找新聞、寫好候選、預設勾好</li>
        <li>你在 10:00 前勾選／微調，按「⏰ 存檔並 10:00 發布」（或「存檔並發布」立刻上線）</li>
        <li>沒時間看也沒關係：10:00 會照預設勾選自動上線</li>
        <li id="draftNote"></li>
        <li>早報只保留一年，舊的自動刪除</li>
      </ol>
    </aside>
  </div>
</template>
<script type="module">
import { store } from "./assets/store.js?v=20261118165907";
import { header, footer, esc, toast, fmtTime } from "./assets/ui.js?v=20261118165907";
import { loadIndex, loadRaw, visible, fmtDay, CAT_STYLE, factsText } from "./assets/brief.js?v=20261118165907";
const CFG = window.BLOG_CONFIG;
header("badmin"); footer();
const root = document.getElementById("root");
let started = false;
store.onAuth(u => {
  if (!u) { location.href = "login.html?next=brief-admin.html"; return; }
  if (!u.isAdmin) { root.innerHTML = `<div class="paywall" style="margin:40px auto;max-width:520px"><h3>這裡是管理員後台</h3></div>`; return; }
  if (!started) { started = true; start(); }
});

async function start() {
  root.innerHTML = document.getElementById("tpl").innerHTML;
  const $ = id => document.getElementById(id);
  $("draftNote").textContent = `${CFG.briefDraftUntil} 以前（前 5 天）是草稿：一定要你按「存檔並發布」才會上線`;
  const dates = (await loadIndex()).sort().reverse();
  // 一年前的早報：刪掉你的勾選紀錄（雲端排程會刪掉原始檔）
  try {
    const cut = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
    for (const d of await store.listDocs("briefs")) if (d.id < cut) await store.deleteDoc("briefs", d.id);
  } catch (e) { }
  if (!dates.length) { $("cands").innerHTML = `<p class="empty">還沒有任何早報。雲端排程每天 09:00 會產生。</p>`; return; }
  $("date").innerHTML = dates.map(d => `<option value="${d}">${fmtDay(d)}</option>`).join("");
  const s = await store.getDoc("settings", "brief"); $("direction").value = s?.direction || "";
  $("saveDir").onclick = async () => { await store.setDoc("settings", "brief", { direction: $("direction").value.trim(), updatedAt: Date.now() }); toast("方向已儲存 ✓ 明天的候選就會照這個調整"); };

  let raw, ov;
  async function load(d) {
    [raw, ov] = await Promise.all([loadRaw(d), store.getDoc("briefs", d)]);
    $("view").href = "brief.html?d=" + d;
    if (!raw) { $("cands").innerHTML = `<p class="empty">讀不到這天的資料</p>`; return; }
    const picks = new Set(ov?.picks || raw.picks || raw.candidates.filter(c => c.recommend).map(c => c.id));
    $("headline").value = ov?.headline ?? raw.headline ?? "";
    const k = { ...raw.knowledge, ...(ov?.knowledge || {}) };
    $("kTerm").value = k.term || ""; $("kExp").value = k.explain || ""; $("kEx").value = k.example || "";
    E = JSON.parse(JSON.stringify(ov?.edits || {}));
    $("cands").innerHTML = raw.candidates.map(c0 => cardHtml(c0, picks.has(c0.id))).join("");
    count(); status();
  }
  // 每則候選：平常是閱讀模式；按「✏️ 編輯」變成輸入框，改完按「✓ 完成編輯」
  let E = {};
  const FIELDS = [["title", "標題"], ["facts", "📰 新聞資訊"], ["why", "💡 簡單分析"], ["outlook", "🔮 推估可能"]];
  function cardHtml(c0, on, editing = false) {
    const c = { ...c0, ...(E[c0.id] || {}) }, [icon, color] = CAT_STYLE[c.category] || ["📰", "#4A3426"];
    const changed = E[c0.id] && Object.keys(E[c0.id]).length;
    const head = `<div class="cand-top"><label class="cand-chk"><input type="checkbox" ${on ? "checked" : ""}><span class="cand-cat" style="--c:${color}">${icon} ${esc(c.category || "")}</span>${c0.recommend ? `<span class="badge pin">小Edward 推薦</span>` : ""}${c.score ? `<span class="stamp">重要度 ${"★".repeat(c.score)}${"☆".repeat(5 - c.score)}</span>` : ""}${changed ? `<span class="badge draft">✏️ 你改過</span>` : ""}</label>
        <span class="cand-acts">${editing
          ? `${changed ? `<button type="button" class="btn ghost sm" data-act="revert">↩ 還原原稿</button>` : ""}<button type="button" class="btn ghost sm" data-act="cancel">取消</button><button type="button" class="btn sm" data-act="done">✓ 完成編輯</button>`
          : `<button type="button" class="btn ghost sm" data-act="edit">✏️ 編輯</button>`}</span></div>`;
    const body = editing
      ? FIELDS.map(([f, label]) => `<label class="cand-lbl">${label}</label><textarea class="cand-ta" data-f="${f}" rows="${f === "title" ? 1 : 3}">${esc(f === "facts" ? factsText(c) : (c[f] || ""))}</textarea>`).join("")
      : `<h4>${esc(c.title)}</h4>
        ${(c.index || []).length ? `<p class="stamp" style="margin:4px 0">📊 行情數字（${c.index.map(x => esc(x.name)).join("、")}）網站會用表格顯示，這裡不重複</p>` : ""}
        <p class="pre">${esc(factsText(c))}</p>
        <div class="cand-sec"><b>🔍 交叉比對（出處）：</b>${(c.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}${s.date ? "（" + esc(s.date) + "）" : ""}</a>`).join("、") || "—"}</div>
        <div class="cand-why"><b>💡 簡單分析：</b><span class="pre">${esc(c.why)}</span></div>
        <div class="cand-sec"><b>🔮 推估可能：</b><span class="pre">${esc(c.outlook || "")}</span></div>`;
    return `<div class="cand ${on ? "on" : ""} ${editing ? "editing" : ""}" data-id="${c0.id}">${head}${body}
        <div class="cand-pc"><div class="pro"><b>👍 放的好處</b>${esc(c.pros || "")}</div><div class="con"><b>⚠️ 放的壞處</b>${esc(c.cons || "")}</div></div>
      </div>`;
  }
  const fit = ta => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
  $("cands").addEventListener("input", e => { if (e.target.classList.contains("cand-ta")) fit(e.target); });
  $("cands").addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const card = b.closest(".cand"), id = card.dataset.id, c0 = raw.candidates.find(x => x.id === id), on = card.querySelector("input").checked;
    const redraw = editing => { card.outerHTML = cardHtml(c0, on, editing); const nc = document.querySelector(`.cand[data-id="${id}"]`); nc.querySelectorAll(".cand-ta").forEach(fit); if (editing) nc.querySelector(".cand-ta")?.focus(); count(); };
    if (b.dataset.act === "edit") return redraw(true);
    if (b.dataset.act === "cancel") return redraw(false);
    if (b.dataset.act === "revert") { delete E[id]; toast("已還原成小Edward 原稿（記得存檔）"); return redraw(false); }
    if (b.dataset.act === "done") {
      const e2 = {};
      card.querySelectorAll(".cand-ta").forEach(t => { const v = t.value.trim(); if (v !== (t.dataset.f === "facts" ? factsText(c0) : (c0[t.dataset.f] || "")).trim()) e2[t.dataset.f] = v; });
      if (Object.keys(e2).length) E[id] = e2; else delete E[id];
      toast("改好了 ✓ 最後記得按「存檔」或「存檔並發布」"); redraw(false);
    }
  });
  function count() {
    const n = document.querySelectorAll(".cand input:checked").length;
    $("nPick").textContent = n;
    document.querySelectorAll(".cand").forEach(c => c.classList.toggle("on", c.querySelector("input").checked));
  }
  function status() {
    const live = visible(raw, ov);
    const draftDays = raw.date <= CFG.briefDraftUntil;
    $("status").textContent = (live ? "🟢 讀者看得到" : "⚪ 讀者還看不到")
      + (ov ? `・你在 ${fmtTime(ov.updatedAt)} 改過（${ov.status === "published" ? "已發布" : ov.status === "scheduled" ? `排定 ${fmtTime(ov.publishAt)} 上線` : "草稿"}）` : "・目前是小Edward 的原始版")
      + (draftDays ? "・前 5 天：要你按發布" : `・沒按發布的話 ${CFG.briefPublishTime} 自動上線`)
      + `・產生時間 ${fmtTime(Date.parse(raw.generatedAt))}`;
  }
  $("cands").addEventListener("change", count);
  $("date").onchange = e => load(e.target.value);

  function collect(st) {
    const picks = [...document.querySelectorAll(".cand")].filter(c => c.querySelector("input").checked).map(c => c.dataset.id);
    if (document.querySelector(".cand.editing")) toast("有一則還在編輯中，沒按「✓ 完成編輯」的部分不會存進去", true);
    const edits = JSON.parse(JSON.stringify(E));
    return { picks, edits, headline: $("headline").value.trim(), knowledge: { term: $("kTerm").value.trim(), explain: $("kExp").value.trim(), example: $("kEx").value.trim() }, status: st, updatedAt: Date.now() };
  }
  async function save(st) {
    const d = collect(st);
    if (st !== "draft" && !d.picks.length) return toast("至少勾一則再發布", true);
    if (st === "scheduled") {
      d.publishAt = Date.parse(`${raw.date}T10:00:00+08:00`);
      if (Date.now() >= d.publishAt && !confirm("這一天的 10:00 已經過了，按確定會「立刻」上線。要繼續嗎？")) return;
    }
    const msg = st === "published" ? "已發布 ✓ 讀者現在看得到了"
      : st === "scheduled" ? (Date.now() >= d.publishAt ? "已發布 ✓（10:00 已過，所以立刻上線）" : `已存檔 ✓ 會在 ${raw.date.replace(/-/g, "/")} 10:00 自動上線`)
      : "已存檔（讀者看不到）";
    try { await store.setDoc("briefs", raw.date, d); ov = d; status(); toast(msg); }
    catch (e) { toast("存檔失敗：" + e.message, true); }
  }
  $("saveDraft").onclick = () => save("draft");
  $("publish").onclick = () => save("published");
  $("publishAt10").onclick = () => save("scheduled");
  $("reset").onclick = async () => {
    if (!confirm("清掉你的勾選與修改，回到小Edward 的原始版？")) return;
    await store.deleteDoc("briefs", raw.date); ov = null; load(raw.date); toast("已恢復原始版");
  };
  load(dates[0]);
}
</script>
</body>
</html>
