<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入｜Edward 的 Blog</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261117165704">
<script src="config.js?v=20261117165704"></script>
</head>
<body>
<main><div class="wrap">
  <div class="auth">
    <h1>歡迎回來</h1>
    <p class="stamp" id="sub">會員與管理員都從這裡登入。</p>
    <div class="tabs"><button class="on" data-t="in">登入</button><button data-t="up">註冊會員</button></div>
    <form id="f" autocomplete="on">
      <div id="nameBox" hidden><label for="name">怎麼稱呼你</label><input id="name" autocomplete="nickname"></div>
      <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
      <label for="pw">密碼</label><div class="pwbox"><input id="pw" type="password" required minlength="6" autocomplete="current-password"><button type="button" id="eye" class="eye" aria-label="顯示密碼" aria-pressed="false">顯示</button></div>
      <button class="btn" style="width:100%;margin-top:18px" id="go">登入</button>
      <div class="msg" id="msg"></div>
      <p style="text-align:center;margin:8px 0 0"><a href="#" id="forgot" class="stamp">忘記密碼？</a></p>
    </form>
    <p class="stamp" id="demoNote" hidden style="border-top:1px solid var(--ln);padding-top:10px;margin-top:14px">示範模式：第一個「註冊會員」的帳號會自動成為管理員（就是你），之後註冊的都是一般會員。資料只存在這台電腦。</p>
  </div>
</div></main>
<script type="module">
import { store, MODE } from "./assets/store.js?v=20261117165704";
import { header, footer } from "./assets/ui.js?v=20261117165704";
header(""); footer();
let mode = "in";
const $ = id => document.getElementById(id);
if (MODE === "demo") $("demoNote").hidden = false;
// 會員功能關閉時：隱藏「註冊會員」分頁（示範模式在本機仍保留，才能建立第一個管理員）
if (!window.BLOG_CONFIG.membersEnabled && MODE !== "demo") document.querySelector('.tabs [data-t="up"]').hidden = true;
$("eye").addEventListener("click", () => {
  const show = $("pw").type === "password";
  $("pw").type = show ? "text" : "password";
  $("eye").textContent = show ? "隱藏" : "顯示";
  $("eye").setAttribute("aria-pressed", String(show)); $("eye").setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
  $("pw").focus();
});
const next = new URLSearchParams(location.search).get("next");
const goNext = u => location.href = next && !/^https?:|^\/\//.test(next) ? next : (u.isAdmin ? "admin.html" : "member.html");

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.t; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("nameBox").hidden = mode !== "up"; $("go").textContent = mode === "up" ? "免費註冊" : "登入";
  $("pw").autocomplete = mode === "up" ? "new-password" : "current-password"; $("msg").textContent = "";
});
$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "處理中…";
  try {
    const u = mode === "up" ? await store.signUp($("email").value, $("pw").value, $("name").value.trim()) : await store.signIn($("email").value, $("pw").value);
    goNext(u);
  } catch (err) { $("msg").className = "msg bad"; $("msg").textContent = err.message; $("go").disabled = false; }
});
$("forgot").addEventListener("click", async e => {
  e.preventDefault();
  if (!$("email").value) { $("msg").className = "msg bad"; $("msg").textContent = "先在上面填 Email，再按忘記密碼"; return; }
  try { await store.resetPassword($("email").value); $("msg").className = "msg good"; $("msg").textContent = "已寄出重設密碼信，請收信"; }
  catch (err) { $("msg").className = "msg bad"; $("msg").textContent = err.message; }
});
</script>
</body>
</html>
