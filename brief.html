<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日財經早報｜Edward 的 Blog</title>
<meta name="description" content="每天 3 分鐘，看懂今天的財經大事與為什麼重要。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261117170012">
<script src="config.js?v=20261117170012"></script>
</head>
<body>
<main><div class="wrap narrow article">
  <div class="bf-nav"><a href="index.html" class="stamp">← 回首頁</a><span><select id="pick" aria-label="選擇日期"></select></span></div>
  <div id="bf"><div class="empty">載入中…</div></div>
  <div class="bf-pager"><a id="prev" class="btn ghost sm" hidden>‹ 前一天</a><a id="next" class="btn ghost sm" hidden>後一天 ›</a></div>
</div></main>
<script type="module">
import { store } from "./assets/store.js?v=20261117170012";
import { header, footer } from "./assets/ui.js?v=20261117170012";
import { loadIndex, loadRaw, merge, visible, renderBrief, fmtDay } from "./assets/brief.js?v=20261117170012";
header("brief"); footer();
const el = document.getElementById("bf");
store.onAuth(async u => {
  const all = (await loadIndex()).sort().reverse();
  const want = new URLSearchParams(location.search).get("d");
  // 只列出讀者看得到的日子（管理員可以看全部，草稿會標示）
  const shown = [];
  for (const d of all) {
    const [raw, ov] = await Promise.all([loadRaw(d), store.getDoc("briefs", d)]);
    const ok = visible(raw, ov);
    if (ok || u?.isAdmin) shown.push({ d, raw, ov, ok });
    if (shown.length >= 400) break;
  }
  if (!shown.length) { el.innerHTML = `<div class="empty">早報準備中，明天早上 8 點見！</div>`; return; }
  const cur = shown.find(x => x.d === want) || shown[0];
  document.getElementById("pick").innerHTML = shown.map(x => `<option value="${x.d}" ${x === cur ? "selected" : ""}>${fmtDay(x.d)}${x.ok ? "" : "（草稿，只有你看得到）"}</option>`).join("");
  document.getElementById("pick").onchange = e => location.search = "?d=" + e.target.value;
  const i = shown.indexOf(cur);
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  if (shown[i + 1]) { prev.hidden = false; prev.href = "?d=" + shown[i + 1].d; }
  if (shown[i - 1]) { next.hidden = false; next.href = "?d=" + shown[i - 1].d; }
  const b = merge(cur.raw, cur.ov);
  document.title = `${fmtDay(b.date)} 每日財經早報｜Edward 的 Blog`;
  renderBrief(el, b);
  if (!cur.ok) el.insertAdjacentHTML("afterbegin", `<p class="msgbox">這份還沒公開（草稿或還沒到 08:00），只有你看得到。到「📰早報後台」勾選、發布。</p>`);
});
</script>
</body>
</html>
