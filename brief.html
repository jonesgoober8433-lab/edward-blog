<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png"><meta name="theme-color" content="#FFFAF0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日財經早報｜Edward 的 Blog</title>
<meta name="description" content="每天 3 分鐘，看懂今天的財經大事與為什麼重要。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap"></noscript>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="assets/style.css?v=20261127170035">
<script src="config.js?v=20261127170035"></script>
</head>
<body>
<main><div class="wrap narrow article">
  <div class="bf-nav"><a href="index.html" class="stamp">← 回首頁</a><span><select id="pick" aria-label="選擇日期"></select></span></div>
  <div id="bf"><div class="empty">載入中…</div></div>
  <div class="bf-pager"><a id="prev" class="btn ghost sm" hidden>‹ 前一天</a><a id="next" class="btn ghost sm" hidden>後一天 ›</a></div>
</div></main>
<script>window.__ebDeferFirebase = true;</script>
<script type="module">
import { store } from "./assets/store.js?v=20261127170035";
import { header, footer, toast } from "./assets/ui.js?v=20261127170035";
import { loadIndex, loadBriefRows, merge, renderBrief, fmtDay } from "./assets/brief.js?v=20261127170035";
const el = document.getElementById("bf");
header("brief"); footer();
let rows = null, authUser, paintKey = "";
function sameUser(a, b) {
  if (!a && !b) return true;
  if (!a || !b) return false;
  return a.uid === b.uid && !!a.isAdmin === !!b.isAdmin;
}
function paint(u) {
  if (!rows) return;
  const want = new URLSearchParams(location.search).get("d");
  // 讀者只看已上線的日子；管理員晚一點補上草稿
  const shown = [];
  for (const row of rows) {
    if (row.ok || u?.isAdmin) shown.push(row);
    if (shown.length >= 400) break;
  }
  const key = shown.map(x => x.d + (x.ok ? "1" : "0")).join(",") + "|" + (u?.isAdmin ? "a" : "");
  if (key === paintKey) return;
  paintKey = key;
  if (!shown.length) { el.innerHTML = `<div class="empty">早報準備中，每天早上 10 點見！</div>`; return; }
  const cur = shown.find(x => x.d === want) || shown[0];
  document.getElementById("pick").innerHTML = shown.map(x => `<option value="${x.d}" ${x === cur ? "selected" : ""}>${fmtDay(x.d)}${x.ok ? "" : "（草稿，只有你看得到）"}</option>`).join("");
  document.getElementById("pick").onchange = e => location.search = "?d=" + e.target.value;
  const i = shown.indexOf(cur);
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  prev.hidden = true; next.hidden = true;
  if (shown[i + 1]) { prev.hidden = false; prev.href = "?d=" + shown[i + 1].d; }
  if (shown[i - 1]) { next.hidden = false; next.href = "?d=" + shown[i - 1].d; }
  const b = merge(cur.raw, cur.ov);
  document.title = `${fmtDay(b.date)} 每日財經早報｜Edward 的 Blog`;
  renderBrief(el, b);
  if (!cur.ok) {
    const sch = cur.ov?.status === "scheduled";
    const at10 = Date.parse(`${cur.d}T10:00:00+08:00`);
    el.insertAdjacentHTML("afterbegin", `<div class="msgbox brief-pub"><span>${sch ? `⏰ 已排定 ${cur.d.replace(/-/g, "/")} 10:00 自動上線，只有你看得到。` : "這份還沒公開（草稿或還沒到 10:00），只有你看得到。"}看完沒問題就按右邊；要改內容到「<a href="brief-admin.html?d=${cur.d}">📰早報後台</a>」。</span>
      ${sch ? "" : `<button type="button" class="btn gold sm" id="pub10">⏰ 存檔並 10:00 發布</button>`}</div>`);
    const btn = document.getElementById("pub10");
    if (btn) btn.onclick = async () => {
      if (Date.now() >= at10 && !confirm("這一天的 10:00 已經過了，按確定會「立刻」上線。要繼續嗎？")) return;
      const raw = cur.raw, ov = cur.ov || {};
      const d = { picks: ov.picks || raw.picks || raw.candidates.filter(c => c.recommend).map(c => c.id), edits: ov.edits || {},
        headline: ov.headline ?? raw.headline ?? "", knowledge: { ...(raw.knowledge || {}), ...(ov.knowledge || {}) },
        status: "scheduled", publishAt: at10, updatedAt: Date.now() };
      if (!d.picks.length) return toast("至少要勾一則，請到早報後台勾選", true);
      btn.disabled = true; btn.textContent = "存檔中…";
      try { await store.setDoc("briefs", cur.d, d); toast(Date.now() >= at10 ? "已發布 ✓（10:00 已過，所以立刻上線）" : "已存檔 ✓ 10:00 會自動上線"); setTimeout(() => location.reload(), 1200); }
      catch (e) { toast("存檔失敗：" + e.message, true); btn.disabled = false; btn.textContent = "⏰ 存檔並 10:00 發布"; }
    };
  }
}
store.onAuth(u => {
  if (authUser !== undefined && sameUser(authUser, u)) return;
  authUser = u;
  if (u?.isAdmin) paint(u);
});
async function loadBriefs() {
  try {
    const all = (await loadIndex()).sort().reverse();
    rows = await loadBriefRows(all);
    paint(authUser?.isAdmin ? authUser : null);
  } finally {
    store.startFirebase();
  }
}
loadBriefs();
</script>
</body>
</html>
