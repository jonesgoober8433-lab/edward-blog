<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edward 的 Blog｜投資理財・退休傳承・社會保險</title>
<meta name="description" content="財務顧問 Edward 用白話整理投資理財、退休傳承與社會保險。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261118081545">
<script src="config.js?v=20261118081545"></script>
</head>
<body>
<main>
  <section class="hero"><div class="wrap">
    <div class="rule"></div>
    <h1 id="siteName">Edward 的 Blog</h1>
    <p id="tagline"></p>
    <div class="search"><input id="q" type="search" placeholder="搜尋文章：例如 勞保、退休、ETF…" aria-label="搜尋文章"></div>
  </div></section>
  <div class="wrap">
    <div class="home-top">
      <section class="mkt" id="mkt" aria-label="市場行情"></section>
      <a class="today-brief" id="todayBrief" href="brief.html" hidden></a>
    </div>
    <div class="filters" id="filters"></div>
    <div class="count-row"><div class="count" id="count"></div><button type="button" class="sort-inline" id="sortInline" hidden>↕ 調整文章順序</button></div>
    <div class="sortbar" id="sortbar" hidden>
      <span>↕ 排序模式：拖曳文章卡片調整順序（手機請按卡片上的 ▲▼）。置頂文章永遠排最前面。</span>
      <span style="display:flex;gap:6px"><button class="btn ghost sm" id="sortCancel">取消</button><button class="btn sm" id="sortSave">完成並儲存</button></span>
    </div>
    <div class="grid" id="grid"><div class="empty">載入中…</div></div>
  </div>
</main>
<script type="module">
import { store } from "./assets/store.js?v=20261118081545";
import { header, footer, esc, fmtDate, toast } from "./assets/ui.js?v=20261118081545";
import { mountMarket } from "./assets/market.js?v=20261118081545";
import { loadIndex, latestVisible, fmtDay } from "./assets/brief.js?v=20261118081545";
mountMarket(document.getElementById("mkt"));
loadIndex().then(latestVisible).then(b => {
  if (!b) return;
  const el = document.getElementById("todayBrief");
  el.href = "brief.html?d=" + b.date; el.hidden = false;
  el.innerHTML = `<span class="tb-tag">📰 每日財經早報・${fmtDay(b.date)}</span>
    <b>${esc(b.headline || "今天的財經重點")}</b>
    <ol>${b.items.slice(0, 4).map(c => `<li>${esc(c.title)}</li>`).join("")}</ol>
    <span class="tb-more">看完整早報（3 分鐘）→</span>`;
});
const CFG = window.BLOG_CONFIG;
header("home"); footer();
document.getElementById("siteName").textContent = CFG.siteName;
document.getElementById("tagline").textContent = CFG.tagline;

let posts = [], cat = "全部", texts = {};
const q = document.getElementById("q");
q.value = new URLSearchParams(location.search).get("q") || "";

async function load() {
  posts = await store.listPosts();
  await Promise.all(posts.map(async p => { texts[p.id] = (await store.searchText(p.id)) || ""; }));
  const cats = ["全部", ...new Set([...CFG.categories, ...posts.map(p => p.category)].filter(Boolean))].filter(c => c === "全部" || posts.some(p => p.category === c));
  // 排版：「全部」自己一列；其餘每列最多 4 個、平均分配（5→3+2、7→4+3、9→3+3+3）
  const rest = cats.filter(c => c !== "全部");
  const rows = Math.max(1, Math.ceil(rest.length / 4)), cols = Math.max(1, Math.ceil(rest.length / rows));
  const chip = c => `<button class="chip ${c === cat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`;
  document.getElementById("filters").innerHTML = chip("全部") + (rest.length ? `<div class="chip-grid" style="--cols:${cols}">${rest.map(chip).join("")}</div>` : "");
  render();
}
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  cat = b.dataset.c; document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); render();
});
q.addEventListener("input", render);

function render() {
  const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = posts.filter(p => (cat === "全部" || p.category === cat) &&
    words.every(w => [p.title, p.summary, p.category, ...(p.tags || []), texts[p.id]].join(" ").toLowerCase().includes(w)));
  document.getElementById("count").textContent = words.length || cat !== "全部" ? `找到 ${list.length} 篇` : `共 ${list.length} 篇文章`;
  const grid = document.getElementById("grid");
  if (!list.length) { grid.innerHTML = `<div class="empty">${posts.length ? "找不到符合的文章，換個關鍵字試試。" : "文章準備中，敬請期待！"}</div>`; return; }
  const showFeatured = !words.length && cat === "全部";
  grid.innerHTML = list.map((p, i) => `
    <a class="card ${showFeatured && i === 0 && p.pinned && !sorting ? "featured" : ""}" href="post.html?id=${encodeURIComponent(p.id)}" data-id="${esc(p.id)}" ${sorting ? `draggable="true"` : ""}>
      ${sorting ? `<span class="sort-ctl"><span class="grip">⠿ 拖曳</span><button type="button" data-mv="up" aria-label="往前">▲</button><button type="button" data-mv="down" aria-label="往後">▼</button></span>` : ""}
      <div class="cover ${p.cover ? "" : "blank"}" data-cat="${esc(p.category || "Edward")}" ${p.cover ? `style="background-image:url('${esc(p.cover)}')"` : ""}></div>
      <div class="in">
        <span class="tag">${esc(p.category || "")}</span>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.summary || "")}</p>
        <div class="meta">
          ${p.pinned ? `<span class="badge pin">置頂</span>` : ""}
          ${p.visibility === "members" ? `<span class="badge lock">VIP</span>` : ""}
          <span>發布 ${fmtDate(p.publishedAt || p.createdAt)}</span>
          ${p.updatedAt && p.updatedAt - (p.publishedAt || 0) > 864e5 ? `<span>更新 ${fmtDate(p.updatedAt)}</span>` : ""}
        </div>
      </div>
    </a>`).join("");
}
// ---------- 管理員專用：在首頁直接拖曳文章順序 ----------
let sorting = false;
const sortBtn = document.getElementById("sortInline");
function setSort(on) {
  sorting = on; document.body.classList.toggle("sorting", on);
  document.getElementById("sortbar").hidden = !on; sortBtn.hidden = on || !isAdmin;
  if (on) { cat = "全部"; q.value = ""; document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.c === "全部")); }
  render();
}
let isAdmin = false;
sortBtn.onclick = () => setSort(true);
document.getElementById("sortCancel").onclick = () => setSort(false);
document.getElementById("sortSave").onclick = async () => {
  const ids = [...document.querySelectorAll("#grid .card")].map(c => c.dataset.id);
  const b = document.getElementById("sortSave"); b.disabled = true; b.textContent = "儲存中…";
  try { await store.reorder(ids); posts.sort((a, b2) => ids.indexOf(a.id) - ids.indexOf(b2.id)); toast("順序已儲存 ✓ 讀者重新整理就會看到"); setSort(false); }
  catch (e) { toast("儲存失敗：" + e.message, true); }
  b.disabled = false; b.textContent = "完成並儲存";
};
const gridEl = document.getElementById("grid");
let dragCard = null;
gridEl.addEventListener("click", e => {
  if (!sorting) return;
  const mv = e.target.closest("[data-mv]"); e.preventDefault();
  if (!mv) return;
  const card = mv.closest(".card"), sib = mv.dataset.mv === "up" ? card.previousElementSibling : card.nextElementSibling;
  if (!sib) return;
  mv.dataset.mv === "up" ? gridEl.insertBefore(card, sib) : gridEl.insertBefore(sib, card);
});
gridEl.addEventListener("dragstart", e => { if (!sorting) return; dragCard = e.target.closest(".card"); dragCard?.classList.add("dragging"); });
gridEl.addEventListener("dragend", () => { dragCard?.classList.remove("dragging"); dragCard = null; });
gridEl.addEventListener("dragover", e => {
  if (!sorting || !dragCard) return; e.preventDefault();
  const over = e.target.closest(".card"); if (!over || over === dragCard) return;
  const r = over.getBoundingClientRect(), after = (e.clientY - r.top) / r.height > .5 || (e.clientX - r.left) / r.width > .5 && Math.abs(e.clientY - (r.top + r.height / 2)) < r.height / 3;
  gridEl.insertBefore(dragCard, after ? over.nextSibling : over);
});
store.onAuth(u => { isAdmin = !!u?.isAdmin; sortBtn.hidden = !isAdmin || sorting; load(); });
</script>
</body>
</html>
